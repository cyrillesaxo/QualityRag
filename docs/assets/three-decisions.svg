<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="432" viewBox="0 0 1100 432" role="img" aria-label="Three possible decisions"><title>Three possible decisions</title><desc>All three decisions depend on declared policy and supplied evidence metadata.</desc><rect width="1100" height="432" rx="20" fill="#f8fbfd"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#132c4a}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#53677f}.head{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#516376}.num{font-size:15px;font-weight:bold;fill:white}</style><text x="40" y="53" class="title">Three possible decisions</text><text x="40" y="81" class="sub">All three decisions depend on declared policy and supplied evidence metadata.</text><rect x="28" y="120" width="326" height="214" rx="15" fill="white" stroke="#c4d3e0" stroke-width="2"/><rect x="28" y="120" width="326" height="64" rx="15" fill="#007d72"/><rect x="28" y="164" width="326" height="20" fill="#007d72"/><circle cx="53" cy="150" r="16" fill="white"/><text x="53" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#132c4a">✓</text><text x="77" y="157" font-size="18" font-weight="700" fill="white">ADMIT</text><text x="44" y="217" class="body">Policy obligations met</text><text x="44" y="243" class="body">Application may proceed</text></rect><rect x="385" y="120" width="326" height="214" rx="15" fill="white" stroke="#c4d3e0" stroke-width="2"/><rect x="385" y="120" width="326" height="64" rx="15" fill="#9b3445"/><rect x="385" y="164" width="326" height="20" fill="#9b3445"/><circle cx="410" cy="150" r="16" fill="white"/><text x="410" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#132c4a">×</text><text x="434" y="157" font-size="18" font-weight="700" fill="white">REFUSE</text><text x="401" y="217" class="body">Governing contradiction</text><text x="401" y="243" class="body">Stop generation</text></rect><rect x="742" y="120" width="330" height="214" rx="15" fill="white" stroke="#c4d3e0" stroke-width="2"/><rect x="742" y="120" width="330" height="64" rx="15" fill="#a66a12"/><rect x="742" y="164" width="330" height="20" fill="#a66a12"/><circle cx="767" cy="150" r="16" fill="white"/><text x="767" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#132c4a">?</text><text x="791" y="157" font-size="18" font-weight="700" fill="white">INCONCLUSIVE</text><text x="758" y="217" class="body">Missing or stale evidence</text><text x="758" y="243" class="body">Request further evidence</text></rect><rect x="28" y="355" width="1044" height="54" rx="12" fill="#e6eef5"/><text x="48" y="388" font-size="18">A refusal takes precedence over an inconclusive finding; both block generation.</text></svg>