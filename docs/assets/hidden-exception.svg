<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="432" viewBox="0 0 1100 432" role="img" aria-label="A hidden exception changes the answer"><title>A hidden exception changes the answer</title><desc>An accurate retrieved passage can still leave a governing obligation unresolved.</desc><rect width="1100" height="432" rx="20" fill="#f8fbfd"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#132c4a}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#53677f}.head{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#516376}.num{font-size:15px;font-weight:bold;fill:white}</style><text x="40" y="53" class="title">A hidden exception changes the answer</text><text x="40" y="81" class="sub">An accurate retrieved passage can still leave a governing obligation unresolved.</text><rect x="28" y="120" width="330" height="214" rx="15" fill="white" stroke="#c4d3e0" stroke-width="2"/><rect x="28" y="120" width="330" height="64" rx="15" fill="#17456c"/><rect x="28" y="164" width="330" height="20" fill="#17456c"/><circle cx="53" cy="150" r="16" fill="white"/><text x="53" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#132c4a">1</text><text x="77" y="157" font-size="18" font-weight="700" fill="white">Retrieved rule</text><text x="44" y="217" class="body">General rule supports</text><text x="44" y="243" class="body">the answer</text><rect x="385" y="120" width="330" height="214" rx="15" fill="white" stroke="#c4d3e0" stroke-width="2"/><rect x="385" y="120" width="330" height="64" rx="15" fill="#aa7412"/><rect x="385" y="164" width="330" height="20" fill="#aa7412"/><circle cx="410" cy="150" r="16" fill="white"/><text x="410" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#132c4a">2</text><text x="434" y="157" font-size="18" font-weight="700" fill="white">Missing exception</text><text x="401" y="217" class="body">An additional condition</text><text x="401" y="243" class="body">was not retrieved</text><rect x="742" y="120" width="330" height="214" rx="15" fill="white" stroke="#c4d3e0" stroke-width="2"/><rect x="742" y="120" width="330" height="64" rx="15" fill="#007d72"/><rect x="742" y="164" width="330" height="20" fill="#007d72"/><circle cx="767" cy="150" r="16" fill="white"/><text x="767" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#132c4a">3</text><text x="791" y="157" font-size="18" font-weight="700" fill="white">QualityRag</text><text x="758" y="217" class="body">INCONCLUSIVE</text><text x="758" y="243" class="body">Wgap: missing condition</text><rect x="28" y="355" width="1044" height="56" rx="12" fill="#fff0d6"/><text x="49" y="389" font-size="18">The missing exception must already be declared in PackSpec; automatic discovery is not yet supported.</text></svg>