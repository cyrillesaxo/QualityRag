<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="432" viewBox="0 0 1100 432" role="img" aria-label="How QualityRag works"><title>How QualityRag works</title><desc>Evidence obligations are checked before answer generation.</desc><rect width="1100" height="432" rx="20" fill="#f8fbfd"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#132c4a}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#53677f}.head{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#516376}.num{font-size:15px;font-weight:bold;fill:white}</style><text x="40" y="53" class="title">How QualityRag works</text><text x="40" y="81" class="sub">Evidence obligations are checked before answer generation.</text><rect x="22" y="120" width="193" height="214" rx="15" fill="white" stroke="#c4d3e0" stroke-width="2"/><rect x="22" y="120" width="193" height="64" rx="15" fill="#0c7c80"/><rect x="22" y="164" width="193" height="20" fill="#0c7c80"/><circle cx="47" cy="150" r="16" fill="white"/><text x="47" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#132c4a">1</text><text x="71" y="157" font-size="18" font-weight="700" fill="white">Question</text><text x="38" y="217" class="body">What is being</text><text x="38" y="243" class="body">asked?</text></rect><rect x="242" y="120" width="193" height="214" rx="15" fill="white" stroke="#c4d3e0" stroke-width="2"/><rect x="242" y="120" width="193" height="64" rx="15" fill="#0c7c80"/><rect x="242" y="164" width="193" height="20" fill="#0c7c80"/><circle cx="267" cy="150" r="16" fill="white"/><text x="267" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#132c4a">2</text><text x="291" y="157" font-size="18" font-weight="700" fill="white">PackSpec</text><text x="258" y="217" class="body">Required sources</text><text x="258" y="243" class="body">Scope and freshness</text></rect><rect x="462" y="120" width="193" height="214" rx="15" fill="white" stroke="#c4d3e0" stroke-width="2"/><rect x="462" y="120" width="193" height="64" rx="15" fill="#0c7c80"/><rect x="462" y="164" width="193" height="20" fill="#0c7c80"/><circle cx="487" cy="150" r="16" fill="white"/><text x="487" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#132c4a">3</text><text x="511" y="157" font-size="18" font-weight="700" fill="white">Evidence</text><text x="478" y="217" class="body">Claim and origin</text><text x="478" y="243" class="body">Timestamp and status</text></rect><rect x="682" y="120" width="193" height="214" rx="15" fill="white" stroke="#c4d3e0" stroke-width="2"/><rect x="682" y="120" width="193" height="64" rx="15" fill="#007d72"/><rect x="682" y="164" width="193" height="20" fill="#007d72"/><circle cx="707" cy="150" r="16" fill="white"/><text x="707" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#132c4a">4</text><text x="731" y="157" font-size="18" font-weight="700" fill="white">QualityRag</text><text x="698" y="217" class="body">Constraint checks</text><text x="698" y="243" class="body">WitnessGraph</text><text x="698" y="269" class="body">Wgap</text></rect><rect x="902" y="120" width="176" height="214" rx="15" fill="white" stroke="#c4d3e0" stroke-width="2"/><rect x="902" y="120" width="176" height="64" rx="15" fill="#133b66"/><rect x="902" y="164" width="176" height="20" fill="#133b66"/><circle cx="927" cy="150" r="16" fill="white"/><text x="927" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#132c4a">5</text><text x="951" y="157" font-size="18" font-weight="700" fill="white">Decision</text><text x="918" y="217" class="body">ADMIT</text><text x="918" y="243" class="body">REFUSE</text><text x="918" y="269" class="body">INCONCLUSIVE</text></rect><text x="228" y="243" text-anchor="middle" font-size="28" fill="#1e547a">→</text><text x="448" y="243" text-anchor="middle" font-size="28" fill="#1e547a">→</text><text x="668" y="243" text-anchor="middle" font-size="28" fill="#1e547a">→</text><text x="888" y="243" text-anchor="middle" font-size="28" fill="#1e547a">→</text><rect x="22" y="355" rx="12" width="1056" height="55" fill="#e6f5f1"/><text x="42" y="386" font-size="19" fill="#075850">ADMIT permits the next application step; it does not prove the sources are true.</text></svg>