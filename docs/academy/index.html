<title>QualityRag Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a training console. Sticky status bar, chapter rail, one chapter at a time as a sequence of training frames.
   Deliberately single-theme (dark), matching the Academy films. */
:root{
  --ground:#070A0F; --panel:#0E141C; --panel-2:#131B25; --line:#223042; --line-2:#2E4157;
  --ink:#E8EDF3; --ink-2:#B7C2CF; --muted:#7F8DA0;
  --signal:#57E0CC; --signal-ink:#04110E; --signal-soft:rgba(87,224,204,.12);
  --amber:#F2C26B; --amber-soft:rgba(242,194,107,.12); --red:#FF8A8A; --red-soft:rgba(255,138,138,.12); --violet:#A99BFF;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font:16px/1.6 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
a{color:var(--signal)}
h1,h2,h3{font-family:var(--display);letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,5vw,52px);line-height:1.05}
h2{font-size:24px;line-height:1.2}
h3{font-size:18px}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.mono{font-family:var(--mono)}
.label{font:500 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto}

/* status bar */
.status{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)))}
.status .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;font:600 18px var(--display);color:var(--ink);text-decoration:none;margin-right:auto}
.meter{display:flex;align-items:baseline;gap:6px;font:500 13px var(--mono);color:var(--ink-2);white-space:nowrap}
.meter b{font:600 16px var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.flame{display:inline-block;width:10px;height:14px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:linear-gradient(var(--amber),#FF7A45);transform-origin:50% 100%;animation:flick 1.8s ease-in-out infinite}
@keyframes flick{50%{transform:scale(1.12) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.flame{animation:none}}
.warn-line{width:100%;font:500 13px var(--mono);color:var(--amber)}
.warn-line:empty{display:none}

/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;margin-top:24px}
@media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}}
nav.rail{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:6px}
@media (max-width:860px){nav.rail{position:static;flex-direction:row;flex-wrap:wrap}}
.rail a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);border:1px solid transparent}
.rail a[aria-current="page"]{background:var(--panel);border-color:var(--line-2);color:var(--ink)}
.rail a:hover{color:var(--ink)}
.rail .code{font:600 13px var(--mono);color:var(--signal);width:28px}
.rail .dot{width:8px;height:8px;border-radius:9px;background:var(--line-2);margin-left:auto;flex:none}
.rail .dot.done{background:var(--signal)}.rail .dot.part{background:var(--amber)}
@media (max-width:860px){.rail .t{display:none}.rail .dot{margin-left:0}}

/* frames */
main{min-width:0;display:flex;flex-direction:column;gap:22px}
.frame{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.frame>header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.frame .tf{font:500 12px var(--mono);letter-spacing:.16em;color:var(--signal);text-transform:uppercase}
.frame .xp{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.hero{padding:34px 28px;background:radial-gradient(900px 320px at 0% 0%,rgba(87,224,204,.10),transparent 70%),var(--panel)}
.hero .complaint{font:500 clamp(20px,2.6vw,28px)/1.35 var(--display);color:var(--amber);max-width:40ch}
.lede{color:var(--ink-2);max-width:68ch}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tile{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.tile .k{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:600 26px var(--display);font-variant-numeric:tabular-nums}
.tile .s{font-size:13px;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);letter-spacing:.06em;padding:3px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{color:var(--signal);border-color:rgba(87,224,204,.45);background:var(--signal-soft)}
.chip.warn{color:var(--amber);border-color:rgba(242,194,107,.45);background:var(--amber-soft)}
.chip.bad{color:var(--red);border-color:rgba(255,138,138,.45);background:var(--red-soft)}
.btn{border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);padding:9px 16px;border-radius:9px}
.btn:hover{border-color:var(--signal)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

video{width:100%;border-radius:10px;background:#000;aspect-ratio:16/9;max-width:100%}
.bloom{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.bloom .tile .k{color:var(--signal)}
.dialogue{display:flex;flex-direction:column;gap:12px}
.line{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:700 15px var(--display);color:var(--signal-ink)}
.av.Cloudina{background:var(--signal)}.av.Grumpy{background:var(--amber)}.av.Junior{background:var(--violet)}
.line .who{font:600 13px var(--mono);color:var(--muted)}
.case{border-color:rgba(255,138,138,.35);background:linear-gradient(180deg,var(--red-soft),transparent 60%),var(--panel)}
.case ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
.concept h3{color:var(--ink)}
.concept p{color:var(--ink-2);max-width:70ch}
.hook{border-left:3px solid var(--signal);padding:8px 14px;background:var(--signal-soft);border-radius:0 8px 8px 0}
pre{margin:0;background:#05080C;border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;font:13.5px/1.55 var(--mono);color:var(--ink-2)}
pre .A{color:var(--signal)}pre .I{color:var(--amber)}pre .R{color:var(--red)}
.cmd{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.cmd code{flex:1 1 320px;min-width:0;overflow-x:auto;white-space:nowrap;background:#05080C;border:1px solid var(--line);border-radius:9px;padding:10px 14px;font:14px var(--mono);color:var(--signal)}
input[type=text],textarea{font:15px var(--body);background:#05080C;color:var(--ink);border:1px solid var(--line-2);border-radius:8px;padding:8px 12px;min-width:0}
input[type=text].good{border-color:var(--signal)}input[type=text].bad{border-color:var(--red)}
.recall{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);padding:10px 14px;border-radius:9px}
.opt:hover:not(:disabled){border-color:var(--signal)}
.opt.right{border-color:var(--signal);background:var(--signal-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default}
.why{font-size:14px;color:var(--ink-2)}
.step{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0;padding-top:0}
.boss{border-color:rgba(169,155,255,.4);background:linear-gradient(180deg,rgba(169,155,255,.10),transparent 50%),var(--panel)}
.hp{height:10px;border-radius:9px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.hp>div{height:100%;background:linear-gradient(90deg,var(--violet),var(--red));transition:width .4s}
.hint{font-size:14px;color:var(--amber)}
.conf{display:flex;flex-direction:column;gap:8px;max-width:520px}
.conf input{width:100%;accent-color:var(--signal)}
.scale{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--muted)}
.check li{list-style:none;display:flex;gap:10px;align-items:center}
.check ul{padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.tick{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.tick.on{background:var(--signal);border-color:var(--signal)}
.tick.on::after{content:"";width:8px;height:4px;border:2px solid var(--signal-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.instructor{border-style:dashed;border-color:var(--amber)}
.ask{display:flex;gap:8px;flex-wrap:wrap}.ask input{flex:1 1 260px}
.answer{white-space:pre-wrap;color:var(--ink-2);font-size:15px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-top:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tablewrap{overflow-x:auto}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--signal);color:var(--signal-ink);font:600 14px var(--display);padding:10px 16px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:none}
footer{margin-top:32px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;color:var(--muted);font-size:13px}
[hidden]{display:none!important}
</style>

<div class="status" role="banner"><div class="wrap">
  <a class="brand" href="#home"><svg viewBox="0 0 22 22" width="22" height="22" aria-hidden="true"><path d="M11 20V11M11 11 5 4M11 11l6-7M11 14 7 9M11 14l4-5" fill="none" stroke="#57E0CC" stroke-width="1.8" stroke-linecap="round"/></svg>QualityRag Academy</a>
  <span class="meter"><span class="flame" aria-hidden="true"></span>streak <b id="m-streak">0</b> d</span>

  <span class="meter">level <b id="m-level">Retriever</b></span>
  <span class="meter">reviews due <b id="m-due">0</b></span>
  <div class="warn-line" id="m-warn" role="status"></div>
</div></div>

<div class="wrap shell">
  <nav class="rail" id="rail" aria-label="Chapters"></nav>
  <main id="main-content"></main>
</div>
<div class="wrap"><footer>

</footer></div>

ndency fails and the gateway stops. The team's assistant says on-call may restart it automatically.", "dialogue": [["Junior", "The assistant cited the handbook, an incident report and the runbook. Three citations. We're fine to restart, right?"], ["Grumpy", "Three citations about restarting in general. Not one about restarting the EU gateway when screening is down. Do you want to explain the fine to compliance?"], ["Cloudina", "Start from what the answer needs, not from what search returned. If the rule that governs this case never reached the model, the answer can't be trusted, however good the citations look."]]}, "concepts": [["Relevant is not sufficient", "Retrieval ranks passages by similarity to the question. A passage can be on topic, recent and correctly cited, and still say nothing about the condition that decides the case."], ["Requirements first", "A PackSpec lists what any answer to this kind of question must be backed by. QualityRag checks each requirement on its own and reports which ones have evidence."], ["Conditions need a reader", "When a supporting passage contains words like unless or only, the console flags it. The passage still counts, but the check does not decide whether the exception applies. A person does."]], "hook": "A requirement with no supporting evidence makes the whole result INCONCLUSIVE.", "recall": [{"q": "When a requirement has no supporting evidence, the overall verdict is", "a": ["INCONCLUSIVE"]}, {"q": "The file that lists what an answer must be backed by is called a", "a": ["PackSpec", "pack spec", "packspec"]}], "lab_try": "Remove the annex line from the second evaluation and run it again. Which requirement fails, and what reason does it give?", "wargame": {"name": "02:10, gateway down", "brief": "The EU gateway is down. The assistant answered “yes, restart automatically” and cited four passages. Your compliance officer is asleep. Revenue impact is real, but so is a screening breach.", "steps": [{"q": "What do you do first?" dence.", "Two of three requirements have zero sources.", "INCONCLUSIVE: insufficient independent evidence for two requirements."]}, {"title": "Name the reason", "task": "Which reason does the SDK attach to the unsupported requirements?", "options": ["STALE_EVIDENCE", "INSUFFICIENT_INDEPENDENT_EVIDENCE", "CONTRADICTION"], "correct": 1, "hints": ["Nothing was too old, and nothing contradicted.", "The count of independent origins is below the minimum.", "INSUFFICIENT_INDEPENDENT_EVIDENCE."]}, {"title": "Read the boundary", "task": "After targeted retrieval the verdict is ADMIT. Which statement is true?", "options": ["The source documents are guaranteed to be true", "The declared checks passed on the supplied evidence metadata", "The exception has been verified to apply"], "correct": 1, "hints": ["What does the gate actually inspect?", "It inspects declared requirements and evidence metadata, not the world.", "ADMIT means the declared checks passed on the supplied metadata."]}]}, "quiz": [{"q": "Retrieval returned four relevant, recent passages. Can the answer still be unjustified?", "options": ["No, relevance implies support", "Yes, if a governing requirement has no evidence", "Only if the passages are older than a year"], "correct": 1, "why": "Relevance is about topic. Justification is about every requirement having evidence."}, {"q": "What does QualityRag check first?", "options": ["How confident the model sounds", "Each requirement declared in the PackSpec", "The similarity score of the top passage"], "correct": 1, "why": "Requirements are checked one by one, before any answer is generated."}, {"q": "An incident report says automated recovery reduced downtime. Which requirement does it support?", "options": ["recovery-procedure", "approval-or-exception", "None; it is history, not authority"], "correct": 2, "why": "In the sample corpus the incident is linked to no requirement, so it isn't counted."}, {"q": "A supporting passage contains the word “unless”. What does the console do?", "options": ["Rejects the passage", "Counts it and flags the condition for a person", "Decides whether the exception applies"], "correct": 1, "why": "Qualifiers inside supporting spans are not evaluated by the gate. They are highlighted for a reader."}, {"q": "What should your application do on INCONCLUSIVE?", "options": ["Generate anyway with a disclaimer", "Withhold the answer and fetch the missing evidence", "Lower the policy thresholds"], "correct": 1, "why": "The verdict names the gap so you can retrieve for it."}], "deep": {"title": "The rule in one line", "body": "For each requirement r: let S(r) be the supporting evidence linked to r that is valid, fresh and not contradicted. r is admitted when |origins(S(r))| ≥ min_independent_sources(r). The result is ADMIT only if every r is admitted, REFUSE if any r has a contradiction, and INCONCLUSIVE otherwise. In lab A1 the first run has |origins| = 0 for two requirements, so the result is INCONCLUSIVE."}, "instructor": {"icebreaker": "Ask each participant for one time an assistant gave them a confident answer that turned out to be missing a condition. Two minutes, no names of systems needed.", "confusions": [["“ADMIT means the answer is correct.”", "ADMIT means the declared checks passed on the supplied metadata. Show the README's decision semantics."], ["“The gate reads the passages.”", "In v0.1 it reads evidence metadata (requirement links, origins, dates, status). Show the lab's ev() helper."]], "timing": "Video 1.5 min · lab 10 min · war game 8 min · quiz 5 min. Skip the deep path if short on time.", "activity": "In pairs, write a three-requirement PackSpec for a question from your own work, then swap and try to find a passage set that would ADMIT a wrong answer."}, "status": "Available now"}, {"id": "a2", "code": "A2", "title": "When the evidence is missing", "complaint": "“It confidently invents an answer when the evidence is missing.”", "video": "academy-a2-governed-abstention", "lab_file": "a2_governed_abstention.py", "objectives": [["Remember", "State the three-way decision: generate on ADMIT, withhold on INCONCLUSIVE or REFUSE."], ["Understand", "Explain why “not enough evidence” is a valid, useful answer."], ["Apply", "Wrap a model call in answer_or_withhold() from lab A2."], ["Analyze", "Trace how the gap list is built from the findings."], ["Evaluate", "Assess the risk of calling a model without checking first."], ["Create", "Design the message your users see when an answer is withheld."]], "scenario": {"setup": "Marco runs customer support tooling at a travel company. A customer asks whether a fare rule applies after travel. The policy page that answers it was never indexed.", "dialogue": [["Junior", "The model still answered. It even gave a deadline. Isn't an answer better than nothing?"], ["Grumpy", "An invented deadline is worse than nothing. Someone in Canada found that out in front of a tribunal."], ["Cloudina", "Give the application a third option: withhold. If the check can't admit the answer, say what's missing instead of guessing."]]}, "concepts": [["Abstention is a feature", "Most pipelines have two outcomes: answer or error. QualityRag adds a governed third: the evidence is insufficient, and here is exactly which requirement is unsupported."], ["Check first, then generate", "Call the evaluator before the model. Only an ADMIT result lets your code call the model with the admitted evidence."], ["The gap is the next action", "The findings list each unsupported requirement by id. That list is what your application retrieves for next, or shows to the user."]], "hook": "Only ADMIT lets your code call the model. Everything else withholds and names the gap.", "recall": [{"q": "The one verdict that lets your code call the model is", "a": ["ADMIT"]}, {"q": "In lab A2, the function that decides is called answer_or_____", "a": ["withhold"]}], "case": {"name": "Moffatt v. Air Canada", "court": "BC Civil Resolution Tribunal · 2024 BCCRT 149", "facts": ["Air Canada's website chatbot told a passenger he could claim a bereavement fare after travel, within 90 days.", "The airline's policy page said bereavement fares could not be claimed retroactively.", "Air Canada argued it was not liable for its chatbot's information. The tribunal held it liable for negligent misrepresentation.", "Awarded C$650.88 in damages, plus C$36.14 pre-judgment interest and C$125 in tribunal fees."], "lesson": "A fluent answer is not evidence. An application that can withhold would have said the policy evidence was missing.", "source": ["Mondaq summary of 2024 BCCRT 149", "https://www.mondaq.com/canada/new-technology/1427926/airline-ordered-to-compensate-a-bc-man-because-its-chatbot-provided-inaccurate-information"]}, "lab_try": "Change answer_or_withhold() so the withheld message also prints the verdict reasons for each missing requirement.", "wargame": {"name": "The refund question", "brief": "Your support assistant is live. A customer asks whether they can claim a discounted fare after travelling. Retrieval returns a marketing page and an FAQ about booking, but not the fare-rules page.", "steps": [{"q": "The check returns INCONCLUSIVE for fare-eligibility-rule. What should the customer see?", "options": [["The model's best guess, with a small disclaimer", false, "A disclaimer doesn't stop a customer relying on an invented rule."], ["A clear message that the rule couldn't be confirmed, plus a route to a person", true, "Withholding with a reason and a next step is the governed outcome."], ["A generic error", false, "An error hides the reason. The gap is useful: name it."]]}, {"q": "Your product manager wants fewer withheld answers. What's the right lever?", "options": [["Lower min_independent_sources to 0", false, "The SDK rejects a minimum below 1, and for good reason."], ["Index the fare-rules page and retrieve for named gaps", true, "Fix the evidence supply, not the threshold."], ["Let the model answer when it is confident", false, "Model confidence isn't evidence of anything the policy declares."]]}]}, "boss": {"name": "The Invented Deadline", "phases": [{"title": "Choose the gate", "task": "Where should the evaluate() call sit?", "options": ["After the model answers, to grade it", "Before the model is called", "Only in nightly evaluation"], "correct": 1, "hints": ["What can you still prevent after the answer exists?", "The point is to decide whether to generate at all.", "Before the model is called."]}, {"title": "Build the gap", "task": "Which findings go in the gap list?", "options": ["Every finding", "Findings whose verdict is not ADMIT", "Findings with more than one source"], "correct": 1, "hints": ["You want what's missing.", "Admitted requirements aren't gaps.", "Findings whose verdict is not ADMIT."]}, {"title": "Know the limit", "task": "Your code calls the model directly in one code path, without evaluate(). What does QualityRag do?", "options": ["Blocks the call", "Nothing; enforcement is your application's job", "Logs a warning to the model"], "correct": 1, "hints": ["QualityRag is a library you call.", "It can't see calls it isn't part of.", "Nothing. Enforcement lives in your code."]}]}, "quiz": [{"q": "Which result should withhold the answer?", "options": ["ADMIT only", "INCONCLUSIVE and REFUSE", "REFUSE only"], "correct": 1, "why": "Integrators should refuse or ask for more evidence on either."}, {"q": "What does INCONCLUSIVE give you that a generic error doesn't?", "options": ["A retry timer", "The ids of the unsupported requirements", "A confidence score"], "correct": 1, "why": "The findings name each gap."}, {"q": "Does the base evaluator search again on its own?", "options": ["Yes", "No, re-retrieval is the application's job", "Only for REFUSE"], "correct": 1, "why": "The training guide says the base evaluator does not automatically search again."}, {"q": "In Moffatt v. Air Canada, what did the tribunal decide about the chatbot?", "options": ["It was a separate entity", "The airline was liable for what it said", "The policy page excused the error"], "correct": 1, "why": "The tribunal rejected the separate-entity argument and found negligent misrepresentation."}, {"q": "Is a model call needed to evaluate the evidence?", "options": ["Yes", "No, the evaluator is deterministic and needs no model", "Only for large packs"], "correct": 1, "why": "No LLM is required for evaluation."}], "deep": {"title": "Why abstention is cheap", "body": "The evaluator is a pure function of the PackSpec, the evidence metadata and an as-of time. It makes no network or model calls, so you can run it on every request before generation. Its cost grows with the number of evidence rows, not with document size."}, "instructor": {"icebreaker": "Show the Air Canada facts without the outcome and ask the room to predict the tribunal's decision.", "confusions": [["“Withholding will annoy users.”", "Compare an invented rule with a clear “we couldn't confirm this, here's a person”. Ask which one support would rather defend."], ["“QualityRag stops the model.”", "It returns a verdict. Your code decides. Show the one-path-without-check boss phase."]], "timing": "Video 1.5 min · case 5 min · lab 10 min · war game 6 min · quiz 5 min.", "activity": "Write the exact withheld-answer message for your product, including the gap and the next step. Read three aloud."}, "status": "Available now"}, {"id": "a3", "code": "A3", "title": "Are your sources independent?", "complaint": "“Three sources agree, but they all copied the same original.”", "video": "academy-a3-independent-sources", "lab_file": "a3_independent_sources.py", "objectives": [["Remember", "Recall that QualityRag counts distinct origins, not citations."], ["Understand", "Explain why a mirror or a forwarded copy adds no corroboration."], ["Apply", "Set min_independent_sources to 2 and run lab A3."], ["Analyze", "Trace three citations back to their origin."], ["Evaluate", "Decide when a requirement deserves two independent sources."], ["Create", "Propose the origin metadata your ingestion should record."]], "scenario": {"setup": "Lena reviews an internal research summary. It cites three sources that all agree. Two weeks later an auditor asks where each one came from.", "dialogue": [["Junior", "Three sources agree. That's strong corroboration, isn't it?"], ["Grumpy", "It's one handbook wearing three hats: a PDF, a wiki mirror and somebody's forwarded email."], ["Cloudina", "Count origins, not citations. If your policy needs two independent sources, a copy can't be the second one."]]}, "concepts": [["The deceptive witness", "Evidence that looks like support but isn't: a copy of the same original, an incident report treated as authority, a superseded runbook. Each adds a citation without adding independent support."], ["Origins decide independence", "Every evidence row carries an origin. The evaluator counts the distinct origins among valid supporting rows and compares that number with min_independent_sources."], ["Metadata is the trust boundary", "The origin is whatever your ingestion records. QualityRag counts it faithfully, but it doesn't yet verify authorship or catch a copy that hides where it came from."]], "hook": "Three citations from one origin are one independent source.", "recall": [{"q": "Independence is counted by distinct", "a": ["origins", "origin"]}, {"q": "The PackSpec field that sets how many independent sources a requirement needs is min_independent_____", "a": ["sources"]}], "case": {"name": "Mata v. Avianca, Inc.", "court": "U.S. District Court, S.D.N.Y. · No. 22-cv-1461 (PKC) · 22 June 2023", "facts": ["Lawyers filed a brief citing judicial opinions that did not exist.", "The opinions, with fake quotes and citations, had been generated by ChatGPT.", "The court sanctioned the lawyers and their firm: US$5,000."], "lesson": "A citation that looks right is not support. Support has to trace back to a real, independent origin.", "source": ["Reed Smith summary of Mata v. Avianca (S.D.N.Y. June 22, 2023)", "https://www.reedsmith.com/our-insights/blogs/viewpoints/102ilzz/chatgpt-artificial-intelligence-tool-generates-fake-opinions/"]}, "lab_try": "Give the forwarded email a different origin, “ops-team-inbox”. The verdict becomes ADMIT. Discuss: is that origin really independent? What would your ingestion need to know?", "wargame": {"name": "The audit trail", "brief": "An auditor is reviewing an answer that a policy admitted with min_independent_sources = 2. The evidence shows origins ops-handbook and ops-handbook-wiki.", "steps": [{"q": "What is your first concern?", "options": [["None, two origins were counted", false, "Two origin labels were counted. Whether they're really independent depends on how they were assigned."], ["Whether the wiki is a copy of the handbook with a different origin label", true, "Independence is only as good as the origin metadata."], ["Whether the passages are recent", false, "Freshness matters, but it isn't the concern here."]]}, {"q": "The wiki page is a copy. What's the fix?", "options": [["Record origin from the source of truth at ingestion, so copies share it", true, "Then the evaluator counts them once, as it does for the mirror in the sample data."], ["Raise min_independent_sources to 3", false, "More copies with bad labels would still pass."], ["Delete the wiki", false, "Copies will keep appearing. Fix the metadata, not the corpus."]]}]}, "boss": {"name": "The Three-Headed Witness", "phases": [{"title": "Count", "task": "Rows: ops-7.3 (origin ops-handbook), ops-mirror-7.3 (ops-handbook), fwd-email-7.3 (ops-handbook). How many independent sources?", "options": ["3", "1", "0"], "correct": 1, "hints": ["Look at the origin column only.", "All three share one value.", "1."]}, {"title": "Verdict", "task": "The requirement needs 2. What's the verdict?", "options": ["ADMIT", "INCONCLUSIVE", "REFUSE"], "correct": 1, "hints": ["Is anything contradicted?", "No contradiction, but too few origins.", "INCONCLUSIVE."]}, {"title": "Boundary", "task": "Which of these can QualityRag v0.1 not do?", "options": ["Count copies once when they share an origin", "Verify who really authored a document", "Require two independent sources"], "correct": 1, "hints": ["Two of these are in the lab.", "Authorship verification isn't in the evaluator.", "Verify who really authored a document."]}]}, "quiz": [{"q": "Three citations, one origin, min 2. Verdict?", "options": ["ADMIT", "INCONCLUSIVE", "REFUSE"], "correct": 1, "why": "One distinct origin is below the minimum."}, {"q": "What made lab A3 admit?", "options": ["A fourth copy of the handbook", "Minutes from the change board, a separate origin", "Lowering the minimum"], "correct": 1, "why": "Adding a genuinely separate origin raised the count to 2."}, {"q": "What was the problem in Mata v. Avianca?", "options": ["Stale citations", "Citations to opinions that did not exist", "Too few citations"], "correct": 1, "why": "The cited opinions were fabricated by ChatGPT."}, {"q": "Where does the origin value come from?", "options": ["QualityRag infers it", "Your ingestion metadata", "The language model"], "correct": 1, "why": "The evaluator counts the origin it is given."}, {"q": "How does the console mark the mirrored handbook?", "options": ["As contradicted", "As the same origin, counted once", "It hides it"], "correct": 1, "why": "It shows “Same origin as ops-7.3: counted once, not twice.”"}], "deep": {"title": "Independence as a set", "body": "independent_sources(r) = |{ e.origin : e ∈ valid supporting evidence for r }|. Duplicates collapse because a set has no repeats. The guarantee is therefore exactly as strong as the function that assigns origin. Two documents with different origin labels count twice even if one copied the other."}, "instructor": {"icebreaker": "Hand out three printed “sources” that are visibly the same paragraph in different formats. Ask how many sources the group has.", "confusions": [["“Different file formats mean different sources.”", "Format is not origin. Show the mirror in the corpus: HTML, same origin."], ["“QualityRag detects plagiarism.”", "It counts origin labels. Detection is upstream, in ingestion."]], "timing": "Video 1.5 min · case 5 min · lab 10 min · war game 6 min · quiz 5 min.", "activity": "List the systems your documents come from and decide, for each, what its origin value should be."}, "status": "Available now"}, {"id": "a4", "code": "A4", "title": "Old rules and contradictions", "complaint": "“It uses outdated policies, and picks a side when documents disagree.”", "video": "academy-a4-stale-and-contradicting", "lab_file": "a4_stale_and_contradicted.py", "objectives": [["Remember", "Name the reasons STALE_EVIDENCE and CONTRADICTION."], ["Understand", "Explain how max_age_seconds turns freshness into a requirement."], ["Apply", "Run lab A4 with a one-year age limit."], ["Analyze", "Explain why a contradiction produces REFUSE rather than INCONCLUSIVE."], ["Evaluate", "Choose sensible age limits for different kinds of policy."], ["Create", "Sketch how your ingestion would mark a passage as contradicting."]], "scenario": {"setup": "Sam maintains runbooks for a platform team. A 2024 restart procedure still ranks first in search, and a newer memo says the EU approval rule supersedes it.", "dialogue": [["Junior", "The 2024 runbook is the top hit. Search thinks it's the best match."], ["Grumpy", "It is the best match. It's also out of date. Similarity doesn't read the calendar."], ["Cloudina", "Make freshness part of the contract, and make contradictions visible. Then the result can't quietly pick a side."]]}, "concepts": [["Freshness is declared", "A requirement can set max_age_seconds. Evidence observed earlier than that is rejected with STALE_EVIDENCE before anything is counted."], ["Contradiction refuses", "If any valid evidence for a requirement is marked CONTRADICTS, that requirement is REFUSE, and so is the whole result. The evaluator doesn't choose between documents."], ["The metadata knows the dates", "The evaluator uses observed_at and status from your metadata. It doesn't read effective dates out of documents or spot supersession in free text. That is on the roadmap."]], "hook": "Stale evidence is removed first. Any contradiction makes the result REFUSE.", "recall": [{"q": "The PackSpec field that limits evidence age is max_age_____", "a": ["seconds"]}, {"q": "A requirement with contradicting evidence gets the verdict", "a": ["REFUSE"]}], "lab_try": "Set max_age_seconds to three years and run again. Which reason disappears, and what happens to each verdict?", "wargame": {"name": "The superseded runbook", "brief": "Your assistant answered a restart question using the 2024 runbook. A memo from this year says the EU approval rule supersedes it.", "steps": [{"q": "How should the restart requirement handle the 2024 runbook?", "options": [["Set max_age_seconds so evidence older than the policy cycle is rejected", true, "Freshness becomes part of the requirement, and the reason shows in the result."], ["Delete the runbook from the index", false, "Deletion helps once. An age limit keeps working as documents age."], ["Trust ranking to prefer newer documents", false, "Ranking optimises similarity, not validity."]]}, {"q": "The current handbook supports a restart and the memo contradicts it. What should the result be?", "options": [["ADMIT, because the handbook is newer", false, "That's choosing a side silently."], ["REFUSE, with the contradiction shown", true, "A contradiction is something a person resolves, with both sides visible."], ["INCONCLUSIVE", false, "INCONCLUSIVE means missing evidence. Here the evidence disagrees."]]}]}, "boss": {"name": "The Ghost Policy", "phases": [{"title": "Age", "task": "max_age_seconds = 365 days. Evidence observed 2024-03-01, checked on 2026-11-05. What happens to it?", "options": ["It counts", "It's rejected as STALE_EVIDENCE", "It contradicts"], "correct": 1, "hints": ["How many days apart are the dates?", "979 days is more than 365.", "Rejected as STALE_EVIDENCE."]}, {"title": "Disagreement", "task": "One fresh SUPPORTS row and one fresh CONTRADICTS row. Verdict?", "options": ["ADMIT", "INCONCLUSIVE", "REFUSE"], "correct": 2, "hints": ["What does the evaluator do with CONTRADICTS?", "Any contradiction sets the requirement to REFUSE.", "REFUSE."]}, {"title": "Boundary", "task": "Which can QualityRag v0.1 not do on its own?", "options": ["Reject evidence older than max_age_seconds", "Work out from raw text which document supersedes which", "Refuse on a marked contradiction"], "correct": 1, "hints": ["Two of these were in the lab.", "Supersession in free text needs extraction upstream.", "Work out which document supersedes which."]}]}, "quiz": [{"q": "What does STALE_EVIDENCE mean?", "options": ["The passage is irrelevant", "It was observed earlier than max_age_seconds allows", "It contradicts another passage"], "correct": 1, "why": "Age is computed from observed_at against the as-of time."}, {"q": "Why REFUSE rather than INCONCLUSIVE on a contradiction?", "options": ["REFUSE is faster", "Evidence disagrees, which needs resolution, not more retrieval", "INCONCLUSIVE is only for tables"], "correct": 1, "why": "INCONCLUSIVE means missing. REFUSE means contradicted."}, {"q": "In lab A4, the final result shows which reasons?", "options": ["CONTRADICTION and STALE_EVIDENCE", "Only CONTRADICTION", "UNKNOWN_EVIDENCE"], "correct": 0, "why": "The stale runbook and the contradicting memo both appear."}, {"q": "Where does observed_at come from?", "options": ["The model", "Your evidence metadata", "The document's title"], "correct": 1, "why": "The evaluator only knows the dates you supply."}, {"q": "Evidence dated in the future is", "options": ["Counted", "Rejected as FUTURE_EVIDENCE", "Treated as fresh"], "correct": 1, "why": "The SDK rejects negative ages."}], "deep": {"title": "Order of rejection", "body": "Per evidence row the evaluator checks, in order: required fields present, a known status, a parseable date, not in the future, not older than max_age_seconds, then contradiction or support. So a stale contradicting row is rejected as stale before it can contradict. Lab A4's REFUSE comes from the fresh memo."}, "instructor": {"icebreaker": "Ask who has followed a runbook that turned out to be superseded. What was the clue they missed?", "confusions": [["“REFUSE means the answer is false.”", "It means the declared evidence disagrees. A person resolves it."], ["“QualityRag knows document dates.”", "It knows observed_at from metadata. Effective-date handling is a roadmap item."]], "timing": "Video 1 min · lab 10 min · war game 6 min · quiz 5 min.", "activity": "For three of your policies, choose a max age and justify it in one sentence."}, "status": "Available now"}, {"id": "a5", "code": "A5", "title": "Broken tables", "research": true, "complaint": "“My PDF tables are completely messed up. How would I even know?”", "video": "academy-a5-unverified-extraction", "lab_file": "a5_unverified_extraction.py", "objectives": [["Remember", "Recall that unverified extraction is UNKNOWN, not SUPPORTS."], ["Understand", "Explain how flattening a table can move a condition."], ["Apply", "Run lab A5 and compare the unverified and reviewed cell."], ["Analyze", "Identify which of your sources have tables that matter."], ["Evaluate", "Judge what “partial text only” coverage means for a result."], ["Create", "Design a reviewer step that upgrades an extraction to SUPPORTS."]], "scenario": {"setup": "Ade builds a fees assistant from PDF schedules. The parser flattens a table and the condition “waived above €10,000” lands next to the wrong number.", "dialogue": [["Junior", "The extracted text looks clean. The model read it fine."], ["Grumpy", "Clean text that says the wrong thing. Every wire costs €25? Our biggest client will love that."], ["Cloudina", "Treat an extraction nobody checked as unknown. Then it can't pass as evidence until someone compares it with the page."]]}, "concepts": [["Structure carries meaning", "In a table, a value means something because of its row, column and header. Flattening to text can separate a value from its condition without any visible error."], ["Unknown is honest", "An evidence row with status UNKNOWN is never counted as support. The result shows UNKNOWN_EVIDENCE, so the gap is visible."], ["Anchors, not answers", "In the research track, Semantic Codex indexes CSV rows, PDF pages, DOCX paragraphs and subtitle times with a source anchor for every value, and marks coverage PARTIAL_TEXT_ONLY. It has no OCR yet, and table-structure validation is research."]], "hook": "Unchecked extraction is UNKNOWN. It never counts as support.", "recall": [{"q": "An extraction nobody has checked should have the status", "a": ["UNKNOWN"]}, {"q": "Semantic Codex marks text-only coverage as PARTIAL_TEXT_____", "a": ["ONLY"]}], "lab_try": "Add a second, reviewed cell for the same requirement from a different origin. Does the unverified cell still matter to the verdict?", "wargame": {"name": "The fee schedule", "brief": "Your fees assistant reads PDF schedules. A client is told every wire costs €25, but their transfers are above €10,000 and should be free.", "steps": [{"q": "How should parsed table values enter QualityRag?", "options": [["As SUPPORTS; the parser is reliable", false, "That's how the wrong fee became evidence."], ["As UNKNOWN until reviewed against the page", true, "Unknown never counts, so the answer is withheld until someone checks."], ["Skip tables entirely", false, "Then the fee question can never be answered."]]}, {"q": "What should a reviewer record when a value is confirmed?", "options": [["Change status to SUPPORTS, keeping the page and row anchor", true, "The anchor lets anyone re-check the cell later."], ["Just the corrected number", false, "Without the anchor nobody can audit it."], ["Nothing; the verdict is enough", false, "The verdict depends on the status you record."]]}]}, "boss": {"name": "The Flattened Table", "phases": [{"title": "Status", "task": "A cell read by the parser, not yet checked. Status?", "options": ["SUPPORTS", "UNKNOWN", "CONTRADICTS"], "correct": 1, "hints": ["Has anyone confirmed it?", "Unconfirmed is not support.", "UNKNOWN."]}, {"title": "Verdict", "task": "It's the only evidence for the requirement. Verdict and reason?", "options": ["ADMIT", "INCONCLUSIVE with UNKNOWN_EVIDENCE", "REFUSE with CONTRADICTION"], "correct": 1, "hints": ["UNKNOWN rows are not counted.", "Zero sources, and the reason names the unknown row.", "INCONCLUSIVE with UNKNOWN_EVIDENCE."]}, {"title": "Boundary", "task": "What does QualityRag not do today?", "options": ["Keep source anchors for indexed values", "Repair or validate a broken table", "Mark partial coverage"], "correct": 1, "hints": ["Two of these are in Semantic Codex v0.3.", "Table repair is research.", "Repair or validate a broken table."]}]}, "quiz": [{"q": "Why is flattened table text risky?", "options": ["It's slower to index", "Values can be separated from their conditions", "Models can't read numbers"], "correct": 1, "why": "Row and column structure carries meaning."}, {"q": "What does UNKNOWN evidence contribute to the source count?", "options": ["One source", "Nothing", "Half a source"], "correct": 1, "why": "Only SUPPORTS rows are counted."}, {"q": "What turned the lab's verdict into ADMIT?", "options": ["A second unverified cell", "A reviewer marking the cell SUPPORTS", "Lowering the minimum"], "correct": 1, "why": "The reviewed cell is valid support."}, {"q": "Does Semantic Codex v0.3 do OCR?", "options": ["Yes", "No", "Only for tables"], "correct": 1, "why": "Its documentation says there is no OCR in this release."}, {"q": "Which is research, not shipped?", "options": ["Source anchors for CSV rows", "Table-structure validation", "UNKNOWN status in the SDK"], "correct": 1, "why": "Checking table structure itself is still research."}], "deep": {"title": "Anchors make review possible", "body": "A source anchor (page 4, row 7, column 3) turns “check the extraction” into a bounded task: open one place and compare one value. Without an anchor, review means rereading the document. That's why anchors come before automated validation in the research plan."}, "instructor": {"icebreaker": "Show a real fee or rate table and its copy-pasted text side by side. Ask what changed.", "confusions": [["“A5 means QualityRag fixes tables.”", "It doesn't. It stops unchecked values counting as evidence. Repair is research."], ["“Partial coverage means broken.”", "It means stated limits: text only, no OCR, no images."]], "timing": "Video 1.5 min · lab 8 min · war game 6 min · quiz 5 min.", "activity": "Pick one table your team relies on and write the review step that would upgrade its values to SUPPORTS."}, "status": "Research preview"}, {"id": "a6", "code": "A6", "title": "Combining documents", "research": true, "status": "Available pattern + research", "complaint": "“The answer is spread across three files, and RAG only reads one.”", "video": "academy-a6-combine-documents", "lab_file": "a6_combine_documents.py", "objectives": [["Remember", "Recall that each requirement can be met by a different document."], ["Understand", "Explain why no single passage can prove a multi-document answer."], ["Apply", "Run lab A6 and read which file is missing."], ["Analyze", "Split a compound question into requirements that map to separate sources."], ["Evaluate", "Judge when an explicit link between documents is trustworthy enough to review."], ["Create", "Write RELATE declarations for two documents in your own corpus."]], "scenario": {"setup": "Noor approves vendors. The question “is Acme cleared to process customer data?” needs the contract, the security review and the data processing agreement, which live in three different systems.", "dialogue": [["Junior", "Search found the contract and the security ticket. The model said Acme is cleared. Good enough?"], ["Grumpy", "Two out of three. Guess which one the regulator asks for first. The DPA."], ["Cloudina", "Split the answer into requirements. Each file can satisfy its own part, and the check tells you which part is still missing."]]}, "concepts": [["One answer, many sources", "A compound question is a set of requirements. Each requirement can be supported by a different document from a different origin, so the check combines files without a model doing the combining."], ["The gap is file-shaped", "When one document is missing, its requirement has zero sources. The verdict is INCONCLUSIVE and the finding names it, which usually tells you exactly which system to query next."], ["Links are candidates (research)", "Semantic Codex v1.2 extracts only links a document declares explicitly, as RELATE lines, with line and character anchors. Ordinary sentences create no links, malformed declarations are reported, and every link is a structural candidate, not a fact, until reviewed."]], "hook": "Each requirement can come from a different document. A missing file shows up as a named gap.", "recall": [{"q": "With one of three files missing, the verdict is", "a": ["INCONCLUSIVE"]}, {"q": "Semantic Codex links are structural candidates, not", "a": ["facts", "a fact"]}], "lab_try": "Change one RELATE line to point at a source id that doesn't exist. What does the extractor report, and why is that safer than guessing?", "wargame": {"name": "The vendor review", "brief": "Procurement wants a yes or no on Acme by noon. Your assistant says yes, citing the contract and a security ticket.", "steps": [{"q": "What do you check first?", "options": [["Whether the cited passages are recent", false, "Freshness matters, but the bigger issue is coverage."], ["Whether every requirement in the vendor PackSpec has evidence", true, "The check shows dpa-in-place with zero sources."], ["Whether the model sounded confident", false, "Confidence isn't one of the requirements."]]}, {"q": "A DPA mentions “the security review” in a sentence. Should that create a link between the documents?", "options": [["Yes, the sentence clearly refers to it", false, "Inferring links from prose is exactly what the extractor refuses to do."], ["Only if the document declares the link explicitly, and a reviewer accepts it", true, "Explicit, anchored, reviewed: then it can be projected into the graph."], ["Links don't matter", false, "They matter; they just have to be earned."]]}]}, "boss": {"name": "The Missing Third", "phases": [{"title": "Coverage", "task": "Requirements: contract-signed, security-review, dpa-in-place. Evidence covers the first two. Verdict?", "options": ["ADMIT", "INCONCLUSIVE", "REFUSE"], "correct": 1, "hints": ["Is any requirement at zero?", "dpa-in-place has no sources.", "INCONCLUSIVE."]}, {"title": "Extraction", "task": "Which line becomes a link candidate?", "options": ["The DPA covers the security review.", "RELATE dpa REFERENCES sec", "RELATE sec covers msa"], "correct": 1, "hints": ["Only explicit declarations count.", "The relation must be uppercase and both ids must exist.", "RELATE dpa REFERENCES sec."]}, {"title": "Boundary", "task": "A link candidate exists. What may you do with it?", "options": ["Treat it as a fact", "Review it before projecting it into the graph", "Use it to admit an answer"], "correct": 1, "hints": ["Look at the interpretation field.", "STRUCTURAL_CANDIDATE_NOT_FACT.", "Review it before projecting it."]}]}, "quiz": [{"q": "How does QualityRag combine three documents into one answer?", "options": ["The model merges them", "Each requirement is checked against its own evidence", "It concatenates the files"], "correct": 1, "why": "Requirements are checked independently; each can come from a different file."}, {"q": "What tells you which file is missing?", "options": ["A confidence score", "The finding with zero sources", "The longest passage"], "correct": 1, "why": "The unsupported requirement is named in the findings."}, {"q": "Does Semantic Codex v1.2 extract relationships from ordinary sentences?", "options": ["Yes", "No, only explicit RELATE declarations", "Only for contracts"], "correct": 1, "why": "Its scope is EXPLICIT_SOURCE_DECLARATIONS_ONLY_NOT_NATURAL_LANGUAGE."}, {"q": "What happens to a malformed RELATE line?", "options": ["It's silently skipped", "It's reported as INVALID_EXPLICIT_DECLARATION", "It's auto-corrected"], "correct": 1, "why": "Malformed declarations are reported, not silently accepted."}, {"q": "What is a link candidate's admission status?", "options": ["ADMIT", "INCONCLUSIVE", "REFUSE"], "correct": 1, "why": "Candidates are inspectable evidence, not authorisation."}], "deep": {"title": "Why the combination is sound", "body": "ADMIT(pack) = ∧ over requirements r of [ |origins(S(r))| ≥ min(r) ]. Nothing requires S(r) for different r to share a document, so evidence from n files combines by conjunction, not by text merging. Cross-document reasoning (A REQUIRES B, so B must be checked too) needs explicit edges, which is why the research path anchors and reviews them before any graph projection."}, "instructor": {"icebreaker": "Ask the group for a question at work that can only be answered by opening at least three systems.", "confusions": [["“The model combines the documents.”", "In the check, nothing is merged: each requirement is checked on its own evidence."], ["“Semantic Codex understands relationships.”", "It parses explicit declarations only. Show the sentence that creates no link."]], "timing": "Video 1.5 min · lab 10 min · war game 6 min · quiz 5 min.", "activity": "Turn one compound question from your work into a PackSpec with one requirement per source system."}}, {"id": "a7", "code": "A7", "title": "Diagrams, images and video", "research": true, "status": "Research preview", "complaint": "“It can't understand our diagrams, or our images, or our videos.”", "video": "academy-a7-images-and-video", "lab_file": "a7_images_and_video.py", "objectives": [["Remember", "Recall that visual matches always carry identity UNKNOWN and admission INCONCLUSIVE."], ["Understand", "Explain why a pixel hash measures appearance, not meaning."], ["Apply", "Run lab A7 and compare the distances."], ["Analyze", "Identify which parts of a diagram carry its meaning."], ["Evaluate", "Decide when visual similarity is useful despite its limits."], ["Create", "Propose a text-backed requirement that would make a diagram usable as evidence."]], "scenario": {"setup": "Tomás searches an architecture wiki full of diagrams. The assistant finds “the same diagram” in two places, but in one of them the arrow points the other way.", "dialogue": [["Junior", "The search says the two diagrams are identical. Distance zero."], ["Grumpy", "Identical pixels, give or take an arrowhead. That arrowhead is the difference between A calling B and B calling A."], ["Cloudina", "Visual similarity is a good way to find media. It is not a way to read it. Treat every visual match as a lead, never as evidence."]]}, "concepts": [["Appearance is measurable", "Semantic Codex v0.4 reduces each image, and up to 12 sampled frames from a video's first 60 seconds, to a 64-bit difference hash with a source anchor. Hamming distance between hashes finds near-duplicates and similar-looking media."], ["Meaning is not", "A reversed arrow, a changed number or a different person can all score as near-identical. That's why every match carries identity_status UNKNOWN, and why visual results never admit an answer."], ["Optional scene search", "Semantic Codex v0.5 can rank frames against a text prompt with an OpenCLIP model, off by default. Scores are uncalibrated cosine similarity, not probabilities. There is no OCR and no face or person recognition."]], "hook": "Distance zero means similar pixels, not the same meaning.", "recall": [{"q": "Every visual match carries identity status", "a": ["UNKNOWN"]}, {"q": "The hash Semantic Codex v0.4 uses is a 64-bit difference", "a": ["hash", "dhash"]}], "lab_try": "Draw a third box on the reversed diagram and run the lab again. How much does the distance change for a change that alters the architecture?", "wargame": {"name": "The reversed arrow", "brief": "An incident review needs to know which service calls the payments API. Visual search returns two matching diagrams from the wiki.", "steps": [{"q": "The two diagrams have distance 0. Can you conclude they show the same architecture?", "options": [["Yes, distance 0 means identical", false, "A reversed arrowhead also scores 0 in the lab."], ["No, check the text-backed source of truth", true, "Appearance can't settle direction. Use the service registry or the diagram's source file."], ["Yes, if the file names match", false, "File names don't settle meaning either."]]}, {"q": "How could a diagram become usable evidence?", "options": [["Record its meaning as text the PackSpec can require, and review it", true, "Then the requirement is about the reviewed statement, anchored to the image."], ["Lower the distance threshold", false, "Thresholds tune similarity, not meaning."], ["Run scene search", false, "Scene scores are uncalibrated and don't read diagrams."]]}]}, "boss": {"name": "The Mirror Image", "phases": [{"title": "Measure", "task": "architecture.png vs architecture-reversed.png. What did the lab measure?", "options": ["Distance 0", "Distance 13", "Distance 35"], "correct": 0, "hints": ["Look at the first result.", "The reversed copy is the closest.", "Distance 0."]}, {"title": "Interpret", "task": "What does that distance tell you?", "options": ["The diagrams mean the same", "Their pixels look nearly the same", "The same person drew them"], "correct": 1, "hints": ["What does a dHash encode?", "Brightness gradients, not semantics.", "Their pixels look nearly the same."]}, {"title": "Boundary", "task": "Which can Semantic Codex v0.4–v0.5 not do?", "options": ["Sample video frames with time anchors", "Recognise a person in a photo", "Rank frames against a prompt (optional)"], "correct": 1, "hints": ["Two of these are in the docs.", "Identity recognition is explicitly not performed.", "Recognise a person."]}]}, "quiz": [{"q": "What does Hamming distance between dHashes measure?", "options": ["Semantic similarity", "Whole-frame visual appearance", "Who is in the image"], "correct": 1, "why": "Its scope is BOUNDED_VISUAL_APPEARANCE_NOT_PERSON_IDENTITY."}, {"q": "How much of a video does Semantic Codex v0.4 sample?", "options": ["Every frame", "Up to 12 frames from the first 60 seconds", "Only the first frame"], "correct": 1, "why": "Nominally one frame every 5 seconds, bounded at 12."}, {"q": "Can a visual match admit an answer?", "options": ["Yes, at distance 0", "No, admission stays INCONCLUSIVE", "Only for video"], "correct": 1, "why": "Visual results carry admission INCONCLUSIVE and can_generate false."}, {"q": "Scene-search scores are", "options": ["Calibrated probabilities", "Uncalibrated cosine similarities", "Accuracy percentages"], "correct": 1, "why": "The docs say the score is not a probability."}, {"q": "Does the prototype do OCR?", "options": ["Yes", "No", "Only on diagrams"], "correct": 1, "why": "No OCR is listed among its boundaries."}], "deep": {"title": "Why a reversed arrow scores zero", "body": "dHash shrinks the image to 9×8 greyscale and records whether each pixel is brighter than its right neighbour: 64 bits. An arrowhead is a few dozen pixels in a 320×200 image; after downscaling, flipping it barely moves any comparison across the threshold. The hash is doing exactly its job, measuring coarse appearance, which is why meaning needs a separate, text-backed requirement."}, "instructor": {"icebreaker": "Show two diagrams that differ only in an arrow's direction. Ask who can spot the difference in five seconds.", "confusions": [["“Distance 0 means duplicate.”", "It means near-identical appearance. Show the reversed arrow."], ["“Scene search identifies people.”", "It never does; identity stays UNKNOWN."]], "timing": "Video 1.5 min · lab 8 min · war game 6 min · quiz 5 min.", "activity": "Pick one diagram your team relies on and write the text statement a reviewer would have to confirm for it to count as evidence."}}, {"id": "a8", "code": "A8", "title": "Right rule, wrong scope", "research": true, "status": "Available pattern + research", "complaint": "“It gave the right rule, for the wrong customer or region.”", "video": "academy-a8-wrong-scope", "lab_file": "a8_wrong_scope.py", "objectives": [["Remember", "Recall that applicability can be its own requirement."], ["Understand", "Explain why a relevant rule can be the wrong rule for this customer."], ["Apply", "Run lab A8 with and without a scope clause."], ["Analyze", "Find the scope conditions hidden inside a policy."], ["Evaluate", "Judge which distinctions a purpose must never drop."], ["Create", "Write an applicability requirement for one of your policies."]], "scenario": {"setup": "Elif supports customers in several countries. An EU customer asks about a refund after 20 days, and the assistant answers from the US refund page. (The policies in this chapter are invented.)", "dialogue": [["Junior", "It found the refund policy. It's even the top result."], ["Grumpy", "It found a refund policy. For a different continent."], ["Cloudina", "Make scope a requirement. If nothing says this rule applies to this customer, the answer isn't admitted."]]}, "concepts": [["Relevant but out of scope", "Search ranks by topic. A policy for another region, product or customer tier can be the best match and still not apply."], ["Applicability is a requirement", "Add a requirement such as applies-to-eu and link only evidence that states the scope explicitly. A rule without a matching scope clause leaves that requirement at zero sources, so the result is INCONCLUSIVE."], ["Purpose-scoped lens (research)", "The research lens declares which distinctions a purpose must keep (who a policy applies to, what it grants) and which it may omit (presentation details). Contradictory contracts are rejected, and every lens stays NOT_AUTHENTICATED and INCONCLUSIVE until a trusted verifier promotes it."]], "hook": "Scope is a requirement, not an assumption.", "recall": [{"q": "In lab A8, the requirement that the US policy can't satisfy is applies-to-", "a": ["eu"]}, {"q": "A purpose contract's review status is NOT_", "a": ["AUTHENTICATED"]}], "lab_try": "Link the US policy to applies-to-eu as well and run the lab. Discuss why the evaluator can't catch that mistake, and where it has to be caught instead.", "wargame": {"name": "The cross-border refund", "brief": "Your assistant serves customers in the US and the EU. An EU customer asks about a refund after 20 days.", "steps": [{"q": "How do you stop the US rule answering an EU question?", "options": [["Add an applies-to-eu requirement to the EU refund PackSpec", true, "The US page can't satisfy it, so the result is INCONCLUSIVE."], ["Tell the model to be careful about regions", false, "Instructions aren't checks."], ["Remove the US page from the index", false, "US customers still need it."]]}, {"q": "Where does the customer's region come from?", "options": [["The evaluator infers it", false, "It doesn't. QualityRag doesn't know who the customer is."], ["Your application, which picks the PackSpec for the customer", true, "Selecting the right pack is the application's job."], ["The model guesses it", false, "Guessing scope is the failure we're fixing."]]}]}, "boss": {"name": "The Border Guard", "phases": [{"title": "Verdict", "task": "Evidence: the US refund rule, linked to refund-rule only. The pack also needs applies-to-eu. Verdict?", "options": ["ADMIT", "INCONCLUSIVE", "REFUSE"], "correct": 1, "hints": ["Count sources per requirement.", "applies-to-eu has zero.", "INCONCLUSIVE."]}, {"title": "Fix", "task": "What turns it into a justified ADMIT?", "options": ["Lowering min_independent_sources", "EU terms with an explicit scope clause", "A longer answer"], "correct": 1, "hints": ["What did the second run add?", "A passage that states who the rule applies to.", "EU terms with an explicit scope clause."]}, {"title": "Boundary", "task": "A purpose contract both keeps and omits the predicate grants. What happens?", "options": ["It compiles with a warning", "It's rejected", "It's admitted"], "correct": 1, "hints": ["Required and optional must not overlap.", "The lab prints the error.", "It's rejected."]}]}, "quiz": [{"q": "Why can the right rule be the wrong answer?", "options": ["It's too old", "It applies to a different scope", "It's too long"], "correct": 1, "why": "Relevance is about topic; applicability is about scope."}, {"q": "How does QualityRag enforce scope today?", "options": ["By guessing the customer's region", "Through an applicability requirement in the PackSpec", "Through the model's instructions"], "correct": 1, "why": "Scope is declared as a requirement and checked like any other."}, {"q": "Who supplies the customer's region?", "options": ["QualityRag", "The application", "The language model"], "correct": 1, "why": "The application selects the PackSpec and context."}, {"q": "What may a purpose-scoped lens omit?", "options": ["Anything", "Only predicates explicitly declared optional", "Required predicates if they're rare"], "correct": 1, "why": "Required predicates are always protected."}, {"q": "A lens's QualityRag admission is", "options": ["ADMIT once compiled", "INCONCLUSIVE until a trusted verifier promotes it", "REFUSE"], "correct": 1, "why": "All outputs and receipts remain INCONCLUSIVE."}], "deep": {"title": "What the lens protects", "body": "Given a purpose with required predicates R and optional predicates O (R ∩ O = ∅), the compiler protects every fact whose predicate is in R and every fact used in a positive proof witness, omits only unprotected facts with predicates in O from the active view, and re-evaluates all labelled queries. Any changed answer rejects the lens. Passing a finite set of examples doesn't prove that every critical distinction survived, so the lens stays INCONCLUSIVE."}, "instructor": {"icebreaker": "Ask for an example of a rule people applied correctly to the wrong customer, region or product.", "confusions": [["“QualityRag knows jurisdictions.”", "It knows only what your metadata links. Show the lab_try that mislinks the US page."], ["“The lens is production-ready.”", "It's research-only and fails closed. Show NOT_AUTHENTICATED."]], "timing": "Video 1.5 min · lab 10 min · war game 6 min · quiz 5 min.", "activity": "For one of your policies, write the applies-to requirement and the evidence that would satisfy it."}}, {"id": "a12", "code": "A12", "title": "Measuring improvement", "status": "Experimental", "research": true, "complaint": "“We can't tell if our RAG is getting better, or just sounding better.”", "video": "academy-a12-measure-improvement", "lab_file": "a12_measure_improvement.py", "objectives": [["Remember", "Name the two replay rates: answer rate and false-admission rate."], ["Understand", "Explain why thumbs-up and judge scores don't measure wrong answers admitted."], ["Apply", "Run lab A12 and compare two policy versions."], ["Analyze", "Work out which cases drive each rate."], ["Evaluate", "Decide whether a rate change is worth shipping."], ["Create", "Label ten of your own recorded cases with expect_admit."]], "scenario": {"setup": "Ravi's team ships a new retrieval policy every sprint. The dashboard shows thumbs-up at 87% and a judge score of 4.2. Nobody can say whether wrong answers went down.", "dialogue": [["Junior", "Thumbs up went from 84 to 87 percent. We improved, right?"], ["Grumpy", "Users liked it more. Did it stop telling them wrong things? That's the number the auditor wants."], ["Cloudina", "Record real cases, have a person label what each one should do, and replay every policy on them. Then you have two numbers that mean something."]]}, "concepts": [["Label the outcome, not the prose", "A recorded case is the evidence a search returned plus a label from a person: expect_admit true (it should answer) or false (it should not). The label is about the decision, not the wording."], ["Two rates", "Replay evaluates every case under a policy. Answer rate is the share of should-answer cases admitted. False-admission rate is the share of should-not cases admitted. Lower false admissions at a small cost in answers is often the trade you want."], ["Same gate, recorded evidence", "Replay uses the same deterministic evaluator as production, on recorded evidence. It doesn't re-run retrieval or labelling, so the numbers are reproducible."]], "hook": "Measure two numbers: right answers given, and wrong answers admitted.", "recall": [{"q": "The share of should-not cases that a policy admits is the false-admission", "a": ["rate"]}, {"q": "The case label that says a case should answer is expect_", "a": ["admit"]}], "lab_try": "Add two more should-not cases made of copies of the handbook. How do version 1.0's false-admission rate and version 1.1's change?", "wargame": {"name": "Sprint review", "brief": "Your team proposes v1.1 of the recovery policy. The dashboard shows thumbs-up steady at 87%.", "steps": [{"q": "What do you need before approving v1.1?", "options": [["A higher judge score", false, "A model grading a model doesn't count wrong answers admitted."], ["Replay on labelled recorded cases", true, "Replay gives answer rate and false-admission rate for both versions."], ["More demo questions", false, "Demo questions are the easy cases."]]}, {"q": "Replay: v1.0 admits 60% of should-not cases; v1.1 admits 0% and answers 83% instead of 100%. Ship?", "options": [["Yes, automatically", false, "The trade-off is a decision; look at the lost answer first."], ["Look at the one lost answer, then decide and record why", true, "A14 shows the lost case is a single regulator source. That's a judgement call."], ["No, any lost answer is unacceptable", false, "Then you keep a 60% false-admission rate."]]}]}, "boss": {"name": "The Vanity Metric", "phases": [{"title": "Define", "task": "Six cases should answer; five should not. Policy admits all six and three of the five. False-admission rate?", "options": ["30%", "60%", "100%"], "correct": 1, "hints": ["Divide by the should-not cases only.", "3 of 5.", "60%."]}, {"title": "Compare", "task": "Which result is better for a regulated workflow?", "options": ["100% answers, 60% false admissions", "83% answers, 0% false admissions", "Both are the same"], "correct": 1, "hints": ["What does a wrong answer cost here?", "Wrong answers are the expensive ones.", "83% answers, 0% false admissions."]}, {"title": "Boundary", "task": "What can replay not do?", "options": ["Re-evaluate recorded evidence under two policies", "Decide whether your labels are correct", "Report both rates"], "correct": 1, "hints": ["Labels come from people.", "Replay trusts the labels it's given.", "Decide whether your labels are correct."]}]}, "quiz": [{"q": "What is a recorded case?", "options": ["A transcript of the model's answer", "Retrieved evidence plus a person's expect_admit label", "A judge-model score"], "correct": 1, "why": "Replay cases carry id, evidence and optional expect_admit."}, {"q": "Answer rate is measured over", "options": ["All cases", "Cases labelled expect_admit true", "Cases the model answered"], "correct": 1, "why": "Only labelled should-answer cases count."}, {"q": "Does replay re-run retrieval?", "options": ["Yes", "No, it re-evaluates recorded evidence", "Only for new policies"], "correct": 1, "why": "The replay note says so."}, {"q": "Why aren't thumbs-up rates enough?", "options": ["They're too slow", "They don't count wrong answers admitted", "They need labels"], "correct": 1, "why": "Satisfaction and correctness aren't the same measurement."}, {"q": "What happened to v1.1's false-admission rate in the lab?", "options": ["Stayed at 60%", "Dropped to 0%", "Rose to 75%"], "correct": 1, "why": "Requiring two independent origins blocked every copy-based case."}], "deep": {"title": "The two rates", "body": "answer_rate = |{c : label(c)=true ∧ verdict(c)=ADMIT}| / |{c : label(c)=true}|. false_admission_rate = |{c : label(c)=false ∧ verdict(c)=ADMIT}| / |{c : label(c)=false}|. Unlabelled cases still show flips but don't enter either rate. Because the evaluator is deterministic, the same cases and policy give the same rates on any machine."}, "instructor": {"icebreaker": "Ask each team which metric they report for their assistant, and whether it would go up if the assistant became more confidently wrong.", "confusions": [["“Replay measures retrieval quality.”", "It measures the policy on recorded evidence. Retrieval changes need new recordings."], ["“Labels are automatic.”", "A person decides expect_admit."]], "timing": "Video 1 min · lab 10 min · war game 6 min · quiz 5 min.", "activity": "Label ten real cases from your own logs and compute both rates for your current policy."}}, {"id": "a13", "code": "A13", "title": "Demo vs production", "status": "Experimental", "research": true, "complaint": "“Excellent in the demo, unreliable in production.”", "video": "academy-a13-demo-vs-production", "lab_file": "a13_demo_vs_production.py", "objectives": [["Remember", "Recall that a policy must be scored on held-out cases, not only the ones it was tuned on."], ["Understand", "Explain why demo cases hide copies, stale and weak sources."], ["Apply", "Run lab A13 on both case sets."], ["Analyze", "Classify production failures into copies, staleness and weak sources."], ["Evaluate", "Judge whether a held-out set is hard enough."], ["Create", "Design a held-out set from your own traffic."]], "scenario": {"setup": "Mei's assistant was a hit in the steering-committee demo. Three weeks into production, support tickets show it confidently answering from copies, stale runbooks and wiki pages.", "dialogue": [["Junior", "It was perfect in the demo. What changed?"], ["Grumpy", "Nothing changed. The demo questions were picked because they wor const C = DATA.chapters, BY = Object.fromEntries(C.map(c => [c.id, c]));
const DAY = 86400000, INTERVALS = [1, 3, 7, 14, 30], DECAY = 15;
const today = () => new Date().toISOString().slice(0, 10);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[ch]));
const $ = s => document.querySelector(s);

// ---------- progress: private per learner (db) or this browser ----------
let P = {xp: 0, last: null, streak: 0, best: 0, path: "standard", ch: {}, rev: {}, instructor: false, decayNote: ""};
let store = {save() {}};
const LKEY = "qr-academy-v1";
function local() { try { return JSON.parse(localStorage.getItem(LKEY) || "null"); } catch (e) { return null; } }
function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify(P)); } catch (e) {} }
let saveTimer = null;
function save() { saveLocal(); clearTimeout(saveTimer); saveTimer = setTimeout(() => store.save(P), 800); }
function ch(id) { return P.ch[id] || (P.ch[id] = {recall: {}, war: {}, boss: {}, hints: {}, quiz: null}); }

function applyDecayAndStreak() {
  if (!P.last) return;
  const idle = Math.floor((Date.parse(today()) - Date.parse(P.last)) / DAY) - 1;
  if (idle > 0 && !P.decayed?.[today()]) {
    const lost = Math.min(P.xp, idle * DECAY);
    P.xp -= lost; P.decayed = {[today()]: true};
    if (lost) P.decayNote = `You were away ${idle} day${idle > 1 ? "s" : ""}: −${lost} XP decay. Your streak resets on your next activity.`;
  }
}
function activity() {
  const t = today();
  if (P.last !== t) {
    const gap = P.last ? Math.floor((Date.parse(t) - Date.parse(P.last)) / DAY) : 99;
    P.streak = gap === 1 ? P.streak + 1 : 1; P.best = Math.max(P.best, P.streak); P.last = t; P.decayNote = "";
    for (const m of [7, 30, 100]) if (P.streak === m) { P.xp += m === 7 ? 100 : m === 30 ? 500 : 2000; toast(`${m}-day streak · bonus XP`); }
  }
}
function award(n, why) { activity(); P.xp = Math.max(0, P.xp + n); if (n) toast((n > 0 ? "+" : "") + n + " XP · " + why); save(); meters(); }
function level() { const i = Math.min(DATA.levels.length - 1, Math.floor(P.xp / 500)); return DATA.levels[i]; }
function due() { const now = Date.now(); return Object.entries(P.rev).filter(([, r]) => r.due <= now).map(([k]) => k); }
function meters() {
  $("#m-streak").textContent = P.streak; $("#m-xp").textContent = P.xp; $("#m-level").textContent = level(); $("#m-due").textContent = due().length;
  $("#m-warn").textContent = P.decayNote || (P.last && P.last !== today() ? `Learn something today to keep your ${P.streak}-day streak and avoid −${DECAY} XP a day.` : "");
  renderRail();
}
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2200); }

// ---------- spaced repetition ----------
function reviewItems(c) { return c.recall.map((r, i) => ({key: c.id + ":" + i, from: c.code, q: r.q + " ____", a: r.a[0]})).concat([{key: c.id + ":hook", from: c.code, q: "What was the rule to remember?", a: c.hook}]); }
function schedule(c) { for (const it of reviewItems(c)) if (!P.rev[it.key]) P.rev[it.key] = {step: 0, due: Date.now() + DAY}; }
function allItems() { return Object.fromEntries(C.flatMap(reviewItems).map(i => [i.key, i])); }
function reviewBlock(filterFn) {
  const items = allItems(), keys = due().filter(k => items[k] && filterFn(items[k]));
  const el = document.createElement("section"); el.className = "frame"; el.setAttribute("aria-label", "Spaced review");
  el.innerHTML = `<header><span class="tf">Spaced review</span><h2>Quick recall</h2><span class="xp">+5 XP each</span></header>`;
  if (!keys.length) { el.insertAdjacentHTML("beforeend", `<p class="lede">Nothing due. Finished chapters come back here after 1, 3, 7, 14 and 30 days.</p>`); return el; }
  for (const k of keys.slice(0, 4)) {
    const it = items[k], card = document.createElement("div"); card.className = "tile";
    card.innerHTML = `<div class="k">From ${esc(it.from)}</div><p>${esc(it.q)}</p><details><summary>Show answer</summary><p class="mono" style="color:var(--signal)">${esc(it.a)}</p></details><div class="row" style="margin-top:8px"><button class="btn" data-r="1" type="button">I remembered</button><button class="btn" data-r="0" type="button">I forgot</button></div>`;
    card.querySelectorAll("button").forEach(b => b.onclick = () => {
      const r = P.rev[k], ok = b.dataset.r === "1"; r.step = ok ? Math.min(r.step + 1, INTERVALS.length - 1) : 0; r.due = Date.now() + INTERVALS[r.step] * DAY;
      award(ok ? 5 : 0, "review"); card.remove();
    });
    el.append(card);
  }
  return el;
}

// ---------- rendering helpers ----------
const PATHS = {quick: 0, standard: 1, deep: 2};
function frame(tf, title, xpNote, min) {
  const s = document.createElement("section"); s.className = "frame";
  if (min) s.dataset.pathMin = min;
  s.innerHTML = `<header><span class="tf">${esc(tf)}</span><h2>${esc(title)}</h2>${xpNote ? `<span class="xp">${esc(xpNote)}</span>` : ""}</header>`;
  return s;
}
function applyPath() { document.querySelectorAll("[data-path-min]").forEach(e => { e.hidden = PATHS[P.path] < PATHS[e.dataset.pathMin]; }); document.querySelectorAll(".instructor").forEach(e => e.hidden = !P.instructor); }
function colourOut(s) { return esc(s).replace(/\b(ADMIT|GENERATE)\b/g, '<span class="A">$1</span>').replace(/\b(INCONCLUSIVE|WITHHELD|STALE_EVIDENCE|UNKNOWN_EVIDENCE|INSUFFICIENT_INDEPENDENT_EVIDENCE)\b/g, '<span class="I">$1</span>').replace(/\b(REFUSE|CONTRADICTION)\b/g, '<span class="R">$1</span>'); }
function progressOf(c) {
  const s = P.ch[c.id]; if (!s) return 0;
  const parts = [s.video, c.recall.every((_, i) => s.recall[i]), s.lab, c.wargame.steps.every((_, i) => s.war[i] && s.war[i].solved), c.boss.phases.every((_, i) => s.boss[i]), s.quiz && s.quiz.done];
  return parts.filter(Boolean).length / parts.length;
}
function renderRail() {
  const cur = location.hash.slice(1) || "home", r = $("#rail");
  r.innerHTML = `<a href="#home" ${cur === "home" ? 'aria-current="page"' : ""}><span class="code">◇</span><span class="t">Overview</span></a>` +
    C.map(c => { const p = P.ch[c.id]?.done ? "done" : progressOf(c) > 0 ? "part" : ""; return `<a href="#${c.id}" ${cur === c.id ? 'aria-current="page"' : ""}><span class="code">${c.code}</span><span class="t">${esc(c.title)}</span><span class="dot ${p}" aria-label="${p || "not started"}"></span></a>`; }).join("");
}
