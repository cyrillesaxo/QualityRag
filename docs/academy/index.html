function home() {
  const m = $("#main-content"); m.innerHTML = "";
  const done = C.filter(c => P.ch[c.id]?.done).length;
  const gains = C.map(c => P.ch[c.id]).filter(s => s && s.pre && s.post).map(s => s.post - s.pre);
  const hero = document.createElement("section"); hero.className = "frame hero";
  hero.innerHTML = `<span class="tf">QualityRag Academy · ${C.length} chapters</span><h1>Evidence before answers</h1><p class="lede">${esc(DATA.intro)}</p>
    <div class="row"><a class="btn primary" href="#${(C.find(c => !P.ch[c.id]?.done) || C[0]).id}">${done ? "Continue" : "Start with A1"}</a><a class="btn" href="https://github.com/cyrillesaxo/QualityRag/blob/docs/activation-research-fr-v01/docs/training/film-01-evidence-engine/qualityrag-the-evidence-engine.mp4">Watch the flagship film</a></div>`;
  m.append(hero);
  const stats = frame("Your learning analytics", "Progress");
  stats.insertAdjacentHTML("beforeend", `<div class="grid g3">
    <div class="tile"><div class="k">XP</div><div class="v">${P.xp}</div><div class="s">${level()} · next level at ${(Math.floor(P.xp / 500) + 1) * 500}</div></div>
    <div class="tile"><div class="k">Streak</div><div class="v">${P.streak} d</div><div class="s">best ${P.best} d · milestones at 7, 30, 100</div></div>
    <div class="tile"><div class="k">Chapters complete</div><div class="v">${done} / ${C.length}</div><div class="s">${C.length - done} to go</div></div>
    <div class="tile"><div class="k">Confidence gain</div><div class="v">${gains.length ? (gains.reduce((a, b) => a + b, 0) / gains.length).toFixed(1) : "–"}</div><div class="s">average, on a 1–5 scale</div></div>
    <div class="tile"><div class="k">Reviews due</div><div class="v">${due().length}</div><div class="s">spaced recall from finished chapters</div></div></div>`);
  m.append(stats);
  const path = frame("Learning path", "How deep do you want to go?");
  const opts = [["quick", "Quick · about 20 min a chapter", "Video, core ideas, recall, lab and quiz."], ["standard", "Standard · about 40 min", "Adds the scenario, real case, war game and boss fight."], ["deep", "Deep · about 60 min", "Adds the formal rule behind each chapter."]];
  path.insertAdjacentHTML("beforeend", `<div class="grid g3">${opts.map(o => `<button type="button" class="opt ${P.path === o[0] ? "right" : ""}" data-path="${o[0]}"><b>${o[1]}</b><br><span class="why">${o[2]}</span></button>`).join("")}</div>`);
  path.querySelectorAll("[data-path]").forEach(b => b.onclick = () => { P.path = b.dataset.path; save(); home(); });
  m.append(path);
  m.append(reviewBlock(() => true));
  const road = frame("The full programme", "Twenty problems, one chapter each");
  road.insertAdjacentHTML("beforeend", `<div class="tablewrap"><table><thead><tr><th>Chapter</th><th>The complaint</th><th>Status</th></tr></thead><tbody>${C.map(c => `<tr><td class="mono">${c.code}</td><td><a href="#${c.id}">${esc(c.complaint)}</a></td><td><span class="chip ${c.research ? "warn" : "ok"}">${esc(c.status || (c.research ? "Research preview" : "Available now"))}</span></td></tr>`).join("")}${DATA.roadmap.map(r => `<tr><td class="mono">${r[0]}</td><td>${esc(r[1])}</td><td><span class="chip">${esc(r[2])}</span></td></tr>`).join("")}</tbody></table></div>`);
  m.append(road);
  applyPath();
}

// ---------- chapter ----------
function chapter(c) {
  const s = ch(c.id), m = $("#main-content"); m.innerHTML = "";
  const idx = C.indexOf(c), next = C[idx + 1];
  const hero = document.createElement("section"); hero.className = "frame hero";
  hero.innerHTML = `<span class="tf">Chapter ${c.code}${c.research ? " · research preview" : ""} · ${Math.round(progressOf(c) * 100)}% complete</span><h1>${esc(c.title)}</h1><p class="complaint">${esc(c.complaint)}</p>`;
  m.append(hero);
  m.append(reviewBlock(it => it.from !== c.code));

  const vid = frame("Training frame 01", "Watch the episode", s.video ? "watched · +25 XP earned" : "+25 XP when it ends");
  const src = (DATA.videos || {})[c.video] || `episodes/${c.video}/${c.video}.mp4`;
  vid.insertAdjacentHTML("beforeend", `<video controls preload="metadata" playsinline src="${esc(src)}" aria-label="Episode ${c.code} video"></video><p class="why">Captions are burned into the video. If it doesn't play here, <a href="https://github.com/cyrillesaxo/QualityRag/tree/docs/activation-research-fr-v01/docs/academy/episodes/${c.video}">open it on GitHub</a>.</p>`);
  vid.querySelector("video").addEventListener("ended", () => { if (!s.video) { s.video = true; award(25, "episode watched"); } });
  m.append(vid);

  const obj = frame("Learning objectives", "By the end you can");
  obj.insertAdjacentHTML("beforeend", `<div class="bloom">${c.objectives.map(o => `<div class="tile"><div class="k">${esc(o[0])}</div><p>${esc(o[1])}</p></div>`).join("")}</div>`);
  m.append(obj);

  m.append(confidence(c, "pre"));

  const sc = frame("Training frame 02", "The scenario", "", "standard");
  sc.insertAdjacentHTML("beforeend", `<p class="lede">${esc(c.scenario.setup)}</p><div class="dialogue">${c.scenario.dialogue.map(d => `<div class="line"><div class="av ${d[0]}" aria-hidden="true">${d[0][0]}</div><div><div class="who">${d[0]}</div><p>${esc(d[1])}</p></div></div>`).join("")}</div>`);
  m.append(sc);

  if (c.case) {
    const k = frame("Real case · verified", c.case.name, "", "standard"); k.classList.add("case");
    k.insertAdjacentHTML("beforeend", `<p class="label">${esc(c.case.court)}</p><ul>${c.case.facts.map(f => `<li>${esc(f)}</li>`).join("")}</ul><p class="hook">${esc(c.case.lesson)}</p><p class="why">Source: <a href="${esc(c.case.source[1])}" target="_blank" rel="noopener">${esc(c.case.source[0])}</a></p>`);
    m.append(k);
  }

  const con = frame("Training frame 03", "Core ideas");
  con.insertAdjacentHTML("beforeend", c.concepts.map(x => `<div class="concept"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div>`).join("") + `<p class="hook"><span class="label">Remember this</span><br>${esc(c.hook)}</p>`);
  m.append(con);

  const rc = frame("Active recall", "Quick check", "+10 XP each");
  c.recall.forEach((r, i) => {
    const row = document.createElement("div"); row.className = "recall";
    row.innerHTML = `<label for="rc-${c.id}-${i}">${esc(r.q)}</label><input type="text" id="rc-${c.id}-${i}" autocomplete="off" spellcheck="false" size="16"><button class="btn" type="button">Check</button>`;
    const inp = row.querySelector("input"), b = row.querySelector("button");
    if (s.recall[i]) { inp.value = r.a[0]; inp.classList.add("good"); b.disabled = true; b.textContent = "Correct"; }
    b.onclick = () => { const ok = r.a.some(a => a.toLowerCase() === inp.value.trim().toLowerCase()); inp.classList.toggle("good", ok); inp.classList.toggle("bad", !ok);
      if (ok && !s.recall[i]) { s.recall[i] = true; b.disabled = true; b.textContent = "Correct"; award(10, "recall"); } else if (!ok) b.textContent = "Try again"; };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") b.click(); });
    rc.append(row);
  });
  m.append(rc);

  m.append(lab(c, s));
  m.append(wargame(c, s));
  m.append(boss(c, s));

  const dp = frame("Deep path", c.deep.title, "", "deep");
  dp.insertAdjacentHTML("beforeend", `<p class="lede mono" style="font-size:14px">${esc(c.deep.body)}</p>`);
  m.append(dp);

  m.append(quiz(c, s));
  m.append(confidence(c, "post"));
  m.append(completion(c, s, next));
  m.append(instructor(c));
  applyPath();
}

function confidence(c, phase) {
  const s = ch(c.id), f = frame(phase === "pre" ? "Before you start" : "After the chapter", phase === "pre" ? "How confident are you?" : "How confident are you now?");
  const labels = phase === "pre" ? ["Novice", "Beginner", "Competent", "Proficient", "Expert"] : ["Still learning", "Getting there", "Comfortable", "Confident", "Could teach it"];
  const v = s[phase] || 3;
  f.insertAdjacentHTML("beforeend", `<div class="conf"><label for="cf-${c.id}-${phase}">${esc(c.title)}: <b id="cfv-${c.id}-${phase}">${labels[v - 1]}</b></label><input type="range" min="1" max="5" value="${v}" id="cf-${c.id}-${phase}"><div class="scale"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div><div class="row"><button class="btn" type="button">${s[phase] ? "Update" : "Save"}</button><span class="why" id="cfm-${c.id}-${phase}"></span></div></div>`);
  const r = f.querySelector("input"), out = f.querySelector(`#cfv-${c.id}-${phase}`), msg = f.querySelector(`#cfm-${c.id}-${phase}`);
  r.oninput = () => out.textContent = labels[r.value - 1];
  const say = () => { if (phase === "post" && s.pre && s.post) { const g = s.post - s.pre; msg.textContent = g >= 2 ? `+${g}: a big step up.` : g === 1 ? "+1: you've strengthened it." : g === 0 ? "No change. Try the deep path, or redo the boss fight." : `${g}: this one is hard. Ask Cloudina in the lab, or rewatch the episode.`; } };
  f.querySelector("button").onclick = () => { s[phase] = +r.value; save(); msg.textContent = "Saved."; say(); };
  say();
  return f;
}

function lab(c, s) {
  const f = frame("Training frame 04 · lab", "Run it yourself", s.lab ? "done · +40 XP earned" : "+40 XP");
  const cmd = `python docs/academy/labs/${c.lab_file}`;
  f.insertAdjacentHTML("beforeend", `<p class="lede">From a clone of the QualityRag repository, run the lab. No model, keys or network are needed. The output below is the lab's real output.</p>
    <div class="cmd"><code>${esc(cmd)}</code><button class="btn" type="button" data-copy>Copy</button></div>
    <pre aria-label="Expected output">${colourOut(DATA.labs[c.lab_file])}</pre>
    <p><span class="label">Try it</span><br>${esc(c.lab_try)}</p>
    <div class="row"><button class="btn primary" type="button" data-ran ${s.lab ? "disabled" : ""}>${s.lab ? "Lab done" : "I ran it and read the result"}</button></div>
    <div class="ai" hidden><span class="label">Ask Cloudina, the lab assistant</span><div class="ask"><input type="text" id="ask-${c.id}" placeholder="What does INSUFFICIENT_INDEPENDENT_EVIDENCE mean here?"><button class="btn" type="button" data-ask>Ask</button></div><p class="answer" aria-live="polite"></p></div>`);
  const copyBtn = f.querySelector("[data-copy]");
  copyBtn.onclick = async () => { try { await navigator.clipboard.writeText(cmd); copyBtn.textContent = "Copied"; } catch (e) { const r = document.createRange(); r.selectNodeContents(f.querySelector(".cmd code")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); copyBtn.textContent = "Selected"; } };
  f.querySelector("[data-ran]").onclick = e => { if (!s.lab) { s.lab = true; e.target.disabled = true; e.target.textContent = "Lab done"; award(40, "lab"); } };
  sampleReady.then(sample => {
    if (!sample) return;
    const box = f.querySelector(".ai"), inp = box.querySelector("input"), out = box.querySelector(".answer"), btn = box.querySelector("[data-ask]");
    box.hidden = false;
    let ctl = null;
    const ask = async () => {
      const q = inp.value.trim(); if (!q) return;
      if (ctl) ctl.abort(); ctl = new AbortController(); btn.disabled = true; out.textContent = "Thinking…";
      const prompt = `You are Cloudina, the encouraging, precise lab assistant of QualityRag Academy, chapter ${c.code} "${c.title}".
Answer the learner in at most 120 words, plainly. Only use the facts below; if the answer is not in them, say you are not sure and point to the repository docs. Never invent QualityRag features.
Facts about QualityRag v0.1: evaluate(pack, evidence, as_of) is deterministic and needs no model. Verdicts: ADMIT (every requirement has at least min_independent_sources distinct origins of valid SUPPORTS evidence), REFUSE (any valid evidence marked CONTRADICTS), INCONCLUSIVE otherwise. Reasons: INSUFFICIENT_INDEPENDENT_EVIDENCE, STALE_EVIDENCE (older than max_age_seconds), FUTURE_EVIDENCE, UNKNOWN_EVIDENCE (status UNKNOWN), INVALID_EVIDENCE, CONTRADICTION. ADMIT means the declared checks passed on the supplied metadata, not that a source is true. Origins come from the application's metadata.
Chapter ideas: ${c.concepts.map(x => x[0] + ": " + x[1]).join(" ")}
Lab command: python docs/academy/labs/${c.lab_file}
Lab output:
${DATA.labs[c.lab_file]}
Learner's question: ${q}`;
      try { const r = await sample(prompt, {modelTier: "quick", signal: ctl.signal, onText: ({text}) => { out.textContent = text; }}); out.textContent = r.text; }
      catch (e) { if (e.name === "AbortError") return; out.textContent = e.code === "rate_limited" ? "Cloudina is busy. Try again in a minute." : e.code === "not_granted" ? "Cloudina isn't available on this page." : "Cloudina couldn't answer that. Try rephrasing."; if (e.code === "not_granted") box.hidden = true; }
      finally { btn.disabled = false; }
    };
    btn.onclick = ask; inp.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
  });
  return f;
}

function choiceStep(container, q, options, st, onFirstRight) {
  // st: {first: true|false, solved: bool}; XP only when the first choice is right.
  const el = document.createElement("div"); el.className = "step";
  el.innerHTML = `<p><b>${esc(q)}</b></p><div class="opts"></div><p class="why" aria-live="polite"></p>`;
  const box = el.querySelector(".opts"), why = el.querySelector(".why");
  options.forEach(o => {
    const b = document.createElement("button"); b.type = "button"; b.className = "opt"; b.textContent = o[0];
    b.onclick = () => {
      if (st.first === undefined) st.first = !!o[1];
      b.classList.add(o[1] ? "right" : "wrong"); why.textContent = o[2] || "";
      if (o[1]) { st.solved = true; box.querySelectorAll("button").forEach(x => x.disabled = true); if (st.first) onFirstRight(); else save(); }
      else { b.disabled = true; save(); }
    };
    box.append(b);
  });
  if (st.solved) { const r = options.findIndex(o => o[1]); box.children[r].classList.add("right"); box.querySelectorAll("button").forEach(x => x.disabled = true); why.textContent = options[r][2] || ""; }
  container.append(el);
}

function wargame(c, s) {
  const w = c.wargame, f = frame("Training frame 05 · war game", w.name, "+30 XP per right first call", "standard");
  f.insertAdjacentHTML("beforeend", `<p class="lede">${esc(w.brief)}</p>`);
  w.steps.forEach((stp, i) => { s.war[i] = s.war[i] || {}; choiceStep(f, stp.q, stp.options, s.war[i], () => award(30, "war game")); });
  return f;
}

function boss(c, s) {
  const b = c.boss, f = frame("Boss fight", b.name, "+50 XP a phase · hints cost XP", "standard"); f.classList.add("boss");
  const hp = document.createElement("div"); hp.className = "hp"; hp.innerHTML = "<div></div>"; f.append(hp);
  const setHp = () => { const won = b.phases.filter((_, i) => s.boss[i]).length; hp.firstChild.style.width = (100 - 100 * won / b.phases.length) + "%"; };
  b.phases.forEach((ph, i) => {
    const st = document.createElement("div"); st.className = "step";
    st.innerHTML = `<p class="label">Phase ${i + 1} · ${esc(ph.title)}</p><p><b>${esc(ph.task)}</b></p><div class="opts"></div><div class="row" data-hints></div><p class="hint" aria-live="polite"></p>`;
    const box = st.querySelector(".opts"), hintRow = st.querySelector("[data-hints]"), hintOut = st.querySelector(".hint");
    const used = s.hints[i] || 0;
    const showHints = n => { hintOut.innerHTML = ph.hints.slice(0, n).map(esc).join("<br>"); };
    showHints(used);
    [10, 25, 50].forEach((cost, h) => {
      const hb = document.createElement("button"); hb.type = "button"; hb.className = "btn"; hb.textContent = h < 2 ? `Hint ${h + 1} (−${cost} XP)` : `Reveal (−${cost} XP)`;
      hb.disabled = used > h || !!s.boss[i];
      let armed = false;
      hb.onclick = () => {
        if (!armed) { armed = true; hb.textContent = `Confirm −${cost} XP`; setTimeout(() => { armed = false; hb.textContent = h < 2 ? `Hint ${h + 1} (−${cost} XP)` : `Reveal (−${cost} XP)`; }, 3000); return; }
        s.hints[i] = Math.max(s.hints[i] || 0, h + 1); award(-cost, "hint"); showHints(s.hints[i]); hintRow.querySelectorAll("button").forEach((x, j) => x.disabled = j < s.hints[i]);
      };
      hintRow.append(hb);
    });
    ph.options.forEach((o, j) => {
      const ob = document.createElement("button"); ob.type = "button"; ob.className = "opt"; ob.textContent = o;
      if (s.boss[i]) { ob.disabled = true; if (j === ph.correct) ob.classList.add("right"); }
      ob.onclick = () => {
        if (j === ph.correct) { ob.classList.add("right"); box.querySelectorAll("button").forEach(x => x.disabled = true); hintRow.querySelectorAll("button").forEach(x => x.disabled = true);
          if (!s.boss[i]) { s.boss[i] = true; award(50, "boss phase"); setHp(); if (b.phases.every((_, k) => s.boss[k])) toast(`${b.name} defeated`); } }
        else { ob.classList.add("wrong"); ob.disabled = true; }
      };
      box.append(ob);
    });
    f.append(st);
  });
  setHp();
  return f;
}

function quiz(c, s) {
  const f = frame("Assessment", "Quiz", "+20 XP per right answer, first try");
  const answers = s.quiz?.answers || {};
  c.quiz.forEach((q, i) => {
    const st = document.createElement("div"); st.className = "step";
    st.innerHTML = `<p><b>${i + 1}. ${esc(q.q)}</b></p><div class="opts"></div><p class="why" aria-live="polite"></p>`;
    const box = st.querySelector(".opts"), why = st.querySelector(".why");
    q.options.forEach((o, j) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "opt"; b.textContent = o;
      const lock = () => { box.querySelectorAll("button").forEach((x, k) => { x.disabled = true; if (k === q.correct) x.classList.add("right"); }); why.textContent = q.why; };
      if (answers[i] !== undefined) { if (j === answers[i] && j !== q.correct) b.classList.add("wrong"); }
      b.onclick = () => {
        answers[i] = j; if (j !== q.correct) b.classList.add("wrong"); lock();
        s.quiz = {answers, done: Object.keys(answers).length === c.quiz.length, score: c.quiz.filter((qq, k) => answers[k] === qq.correct).length};
        if (j === q.correct) award(20, "quiz"); else save();
        score.textContent = `Score: ${s.quiz.score} / ${c.quiz.length}`;
      };
      box.append(b);
      if (answers[i] !== undefined && j === q.options.length - 1) setTimeout(lock);
    });
    f.append(st);
  });
  const score = document.createElement("p"); score.className = "label"; score.textContent = s.quiz ? `Score: ${s.quiz.score} / ${c.quiz.length}` : "";
  f.append(score);
  return f;
}

function completion(c, s, next) {
  const f = frame("Completion", s.done ? `${c.code} complete` : "Finish the chapter", s.done ? "" : "+100 XP");
  const items = [["Watched the episode", s.video], ["Answered the quick check", c.recall.every((_, i) => s.recall[i])], ["Ran the lab", s.lab], ["Played the war game", c.wargame.steps.every((_, i) => s.war[i] && s.war[i].solved)], ["Beat the boss", c.boss.phases.every((_, i) => s.boss[i])], ["Finished the quiz", s.quiz && s.quiz.done]];
  const needed = PATHS[P.path] === 0 ? [0, 1, 2, 5] : [0, 1, 2, 3, 4, 5];
  const ok = needed.every(i => items[i][1]);
  f.insertAdjacentHTML("beforeend", `<div class="check"><ul>${items.map((it, i) => `<li><span class="tick ${it[1] ? "on" : ""}" aria-hidden="true"></span><span>${esc(it[0])}${needed.includes(i) ? "" : " (optional on the quick path)"}</span></li>`).join("")}</ul></div>
    <div class="row"><button class="btn primary" type="button" ${s.done || !ok ? "disabled" : ""}>${s.done ? "Completed" : ok ? "Complete chapter" : "Complete the items above first"}</button>${next ? `<a class="btn" href="#${next.id}">Next: ${next.code} · ${esc(next.title)}</a>` : `<a class="btn" href="#home">Back to the overview</a>`}</div>`);
  f.querySelector("button").onclick = () => { if (s.done) return; s.done = true; schedule(c); award(100, `${c.code} complete`); chapter(c); };
  return f;
}

function instructor(c) {
  const n = c.instructor, f = frame("Instructor notes", "Facilitating " + c.code); f.classList.add("instructor");
  f.insertAdjacentHTML("beforeend", `<div class="grid g2"><div class="tile"><div class="k">Ice breaker</div><p>${esc(n.icebreaker)}</p></div><div class="tile"><div class="k">Group activity</div><p>${esc(n.activity)}</p></div></div>
    <div class="tile"><div class="k">Common confusions</div>${n.confusions.map(x => `<p style="margin-top:8px"><b>${esc(x[0])}</b> ${esc(x[1])}</p>`).join("")}</div>
    <div class="tile"><div class="k">Timing</div><p>${esc(n.timing)}</p></div>`);
  return f;
}

// ---------- routing ----------
function route() {
  const id = location.hash.slice(1);
  if (BY[id]) chapter(BY[id]); else home();
  renderRail(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
$("#instructor-toggle").onclick = () => { P.instructor = !P.instructor; $("#instructor-toggle").textContent = "Instructor mode: " + (P.instructor ? "on" : "off"); save(); applyPath(); };

// ---------- boot ----------
const sampleReady = (window.claude?.use ? claude.use("sample") : Promise.resolve(null)).catch(() => null);
(function boot() {
  const l = local(); if (l) P = Object.assign(P, l);
  applyDecayAndStreak(); $("#instructor-toggle").textContent = "Instructor mode: " + (P.instructor ? "on" : "off");
  meters(); route();
  if (!window.claude?.use) return;
  Promise.all([claude.use("db"), claude.use("user")]).then(async ([db, user]) => {
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const doc = db.doc("data/users/" + id + "/academy");
    try {
      const snap = await Promise.race([doc.get(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
      const remote = snap && snap.exists ? snap.data() : null;
      if (remote && typeof remote === "object" && (remote.xp || 0) >= (P.xp || 0)) { P = Object.assign(P, remote); applyDecayAndStreak(); meters(); route(); }
      store = {save: p => doc.set(JSON.parse(JSON.stringify(p))).catch(() => {})};
      $("#saved-where").textContent = "progress saved to your account";
      store.save(P);
    } catch (e) {}
  }).catch(() => {});
})();
</script>
