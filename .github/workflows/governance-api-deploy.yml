name: Governance API private host package
on:
  pull_request:
    paths:
      - 'tools/activation_runtime/deploy/**'
      - '.github/workflows/governance-api-deploy.yml'
  push:
    paths:
      - 'tools/activation_runtime/deploy/**'
      - '.github/workflows/governance-api-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-host-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate operator deployment contract
        run: python -m unittest discover -s tools/activation_runtime/deploy -p 'test_deploy.py' -v
      - name: Python configuration parses
        run: python -m py_compile tools/activation_runtime/deploy/test_deploy.py
