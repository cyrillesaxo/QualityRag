name: Isolated Drive adapter validation
on:
  pull_request:
    paths:
      - 'apps/registry/src/google-drive-connections.js'
      - 'apps/registry/src/protected-drive.js'
      - 'apps/registry/test/drive-adapter-isolated.test.js'
      - '.github/workflows/drive-adapter-tranche.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check apps/registry/src/google-drive-connections.js
          node --check apps/registry/src/protected-drive.js
      - name: Run isolated mock-provider tests
        run: node --test apps/registry/test/drive-adapter-isolated.test.js
