name: Protected decision lifecycle
on:
  pull_request:
    paths:
      - 'apps/registry/src/protected-decision-lifecycle.js'
      - 'apps/registry/src/server.js'
      - 'apps/registry/test/protected-decision-lifecycle.test.js'
      - '.github/workflows/protected-decision-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-revocation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix apps/registry install --no-audit --no-fund
      - name: Verify owner-only status, historical export and permanent revocation
        run: |
          node --check apps/registry/src/protected-decision-lifecycle.js
          node --check apps/registry/src/server.js
          node --test apps/registry/test/protected-decision-lifecycle.test.js apps/registry/test/grounded-delivery-route.test.js
