name: Protected review verifier
on:
  pull_request:
    paths:
      - 'apps/registry/src/protected-admission.js'
      - 'apps/registry/test/protected-review-verifier-isolated.test.js'
      - '.github/workflows/protected-review-verifier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix apps/registry install --no-audit --no-fund
      - name: Validate independent signed-review implementation
        run: |
          node --check apps/registry/src/protected-admission.js
          node --test apps/registry/test/protected-review-verifier-isolated.test.js
