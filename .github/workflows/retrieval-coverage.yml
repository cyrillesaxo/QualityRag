name: Retrieval coverage evaluation
on: [push, pull_request]
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r examples/enterprise-rag/requirements.txt
      - run: python examples/enterprise-rag/build_documents.py
      - run: PYTHONPATH=sdk/python:examples/enterprise-rag python -m unittest discover -s examples/enterprise-rag -p 'test_*.py'
      - run: PYTHONPATH=sdk/python:examples/enterprise-rag python examples/enterprise-rag/evaluate_coverage.py
