name: Offline signed review interoperability
on:
  pull_request:
    paths:
      - 'tools/packspec_compiler/studio_custody.py'
      - 'tools/packspec_compiler/prepare_protected_drive_review.py'
      - 'tools/packspec_compiler/verify_protected_drive_receipt.py'
      - 'tools/packspec_compiler/tests/test_studio_custody.py'
      - '.github/workflows/offline-signed-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signer verification dependency
        run: python -m pip install 'cryptography>=44,<47'
      - name: Validate signed review tools and independent receipt replay
        env:
          PYTHONPATH: tools/packspec_compiler:sdk/python
        run: |
          python -m compileall -q tools/packspec_compiler/studio_custody.py tools/packspec_compiler/prepare_protected_drive_review.py tools/packspec_compiler/verify_protected_drive_receipt.py
          python -m unittest discover -s tools/packspec_compiler/tests -p 'test_studio_custody.py' -v
