name: Studio and Registry
on: [push, pull_request]
jobs:
  registry:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qualityrag
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: qualityrag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualityrag -d qualityrag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_TEST_DATABASE_URL: postgres://qualityrag:testpassword@127.0.0.1:5432/qualityrag_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'cryptography>=44,<47'
      - run: npm --prefix apps/registry install --no-audit --no-fund
      - run: DATABASE_URL="$PG_TEST_DATABASE_URL" node apps/registry/src/migrate.js
      - run: npm --prefix apps/registry test
      - run: python scripts/evidence-custody-show-me.py
  studio:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/studio}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: npm run build
