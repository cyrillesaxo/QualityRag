name: Studio and Registry
on: [push, pull_request]
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'cryptography>=44,<47'
      - run: npm --prefix apps/registry install --no-audit --no-fund
      - run: npm --prefix apps/registry test
  studio:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/studio}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: npm run build
