name: Conversation tree research
on: [push, pull_request]
permissions:
  contents: read
jobs:
  conversation-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/conversation_tree/tests -p 'test_*.py' -v
      - run: python -m tools.conversation_tree.demo > /tmp/conversation-tree-demo.json
