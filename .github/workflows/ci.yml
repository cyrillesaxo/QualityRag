name: SDK CI
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: PYTHONPATH=sdk/python python -m unittest discover -s sdk/python/tests
  typescript:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: sdk/typescript}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: npm test
  java:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: sdk/java}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven, cache-dependency-path: sdk/java/pom.xml}
      - run: mvn --batch-mode test
