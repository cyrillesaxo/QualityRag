name: Evidence review mutations
on:
  pull_request:
    paths:
      - 'apps/registry/src/evidence-review-route.js'
      - 'apps/registry/src/server.js'
      - 'apps/registry/test/evidence-review-route.test.js'
      - '.github/workflows/evidence-review-route.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix apps/registry install --no-audit --no-fund
      - run: |
          node --check apps/registry/src/evidence-review-route.js
          node --test apps/registry/test/evidence-review-route.test.js apps/registry/test/read-only-evidence-telemetry.test.js
