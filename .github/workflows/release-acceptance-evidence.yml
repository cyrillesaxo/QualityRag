name: QualityRAG synthetic release evidence
on:
  pull_request:
    paths:
      - 'apps/registry/**'
      - 'scripts/acceptance-evidence-packet.mjs'
      - 'scripts/drive-governed-control-show-me.mjs'
      - 'scripts/protected-human-admission-show-me.mjs'
      - '.github/workflows/release-acceptance-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent receipt verifier dependency
        run: python -m pip install 'cryptography>=44,<47'
      - name: Install registry dependencies
        run: npm --prefix apps/registry install --no-audit --no-fund
      - name: Execute synthetic HTTP acceptance packet
        run: node scripts/acceptance-evidence-packet.mjs release-evidence
      - name: Save release-evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualityrag-synthetic-evidence-${{ github.run_id }}
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 14
