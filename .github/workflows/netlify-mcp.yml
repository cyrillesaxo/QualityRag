name: QualityRAG remote MCP adapter
on:
  pull_request:
    paths:
      - 'netlify/mcp/**'
      - '.github/workflows/netlify-mcp.yml'
  push:
    branches: [main]
    paths:
      - 'netlify/mcp/**'
      - '.github/workflows/netlify-mcp.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check netlify/mcp/netlify/functions/mcp.mjs
      - name: Adapter contract tests
        run: node --test netlify/mcp/tests/*.test.mjs
      - name: Live Netlify preview authentication and readiness smoke
        if: github.event_name == 'pull_request'
        env:
          QUALITYRAG_MCP_PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--qualityrag-mcp.netlify.app/
        run: node netlify/mcp/tests/live-preview-smoke.mjs
