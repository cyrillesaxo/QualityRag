name: Canonical APX Native Parity (private checkout)

on:
  push:
    branches:
      - main
    paths:
      - 'tools/semantic_store/**'
      - '.github/workflows/rct-native-apx-parity.yml'
  workflow_dispatch:
    inputs:
      apx_ref:
        description: "APX ref to verify (branch, tag or exact commit)"
        type: string
        default: main
        required: true

permissions:
  contents: read

jobs:
  native-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require explicitly configured APX read credentials
        env:
          APX_TOKEN: ${{ secrets.APX_REPO_READ_TOKEN }}
        run: |
          if [ -z "$APX_TOKEN" ]; then
            echo "::error::Configure the read-only APX_REPO_READ_TOKEN repository secret before native parity can run."
            exit 1
          fi
      - name: Checkout QualityRag
        uses: actions/checkout@v4
        with:
          path: qualityrag
          persist-credentials: false
      - name: Checkout original APX packages without copying source into QualityRag
        uses: actions/checkout@v4
        with:
          repository: cyrillesaxo/apx
          ref: ${{ inputs.apx_ref || 'main' }}
          token: ${{ secrets.APX_REPO_READ_TOKEN }}
          path: apx
          persist-credentials: false
          sparse-checkout: |
            packages/apx-wbc
            packages/apx-hcr
            packages/apx-rcoc
            packages/apx-epistemic
            packages/apx-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated TypeScript build toolchain
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/apx-toolchain" --ignore-scripts --no-audit --no-fund --no-save 'typescript@5.6.3' '@types/node@20.11.30'
          ln -s "$RUNNER_TEMP/apx-toolchain/node_modules" "$GITHUB_WORKSPACE/apx/node_modules"
      - name: Compile canonical APX engines
        shell: bash
        run: |
          "$RUNNER_TEMP/apx-toolchain/node_modules/.bin/tsc" -p apx/packages/apx-wbc/tsconfig.json
          "$RUNNER_TEMP/apx-toolchain/node_modules/.bin/tsc" -p apx/packages/apx-hcr/tsconfig.json
          "$RUNNER_TEMP/apx-toolchain/node_modules/.bin/tsc" -p apx/packages/apx-rcoc/tsconfig.json
          "$RUNNER_TEMP/apx-toolchain/node_modules/.bin/tsc" --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck --types node --outDir apx/packages/apx-epistemic/dist apx/packages/apx-epistemic/src/semantic-conversion.ts apx/packages/apx-epistemic/src/semantic-source-spans.ts
          "$RUNNER_TEMP/apx-toolchain/node_modules/.bin/tsc" --noCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck --types node --outDir apx/packages/apx-evidence/dist apx/packages/apx-evidence/src/index.ts
      - name: Execute actual WBC HCR and RCOC behavior tests
        env:
          APX_PACKAGES_ROOT: ${{ github.workspace }}/apx/packages
        run: node --test qualityrag/tools/semantic_store/tests/test_rct_apx_native_real.mjs
      - name: Execute original APX source-to-text semantic falsification tests
        env:
          APX_PACKAGES_ROOT: ${{ github.workspace }}/apx/packages
        run: node --test qualityrag/tools/semantic_store/tests/test_rct_apx_semantic_spans_real.mjs
      - name: Execute original APX 15-cell deception census checks
        env:
          APX_PACKAGES_ROOT: ${{ github.workspace }}/apx/packages
        run: node --test qualityrag/tools/semantic_store/tests/test_rct_apx_deception_real.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QualityRag reviewed-policy verification dependencies
        run: python -m pip install -r qualityrag/tools/packspec_compiler/requirements.txt
      - name: Exercise real APX native subprocess through signed QualityRag host
        env:
          QR_REQUIRE_NATIVE_APX: '1'
          APX_PACKAGES_ROOT: ${{ github.workspace }}/apx/packages
        run: python -m unittest discover -s qualityrag/tools/semantic_store/tests -p 'test_rct_native_semantic_host_real.py' -v
      - name: Quantify actual native APX drift detection and false alarms
        env:
          APX_PACKAGES_ROOT: ${{ github.workspace }}/apx/packages
        run: |
          python qualityrag/tools/semantic_store/rct_semantic_evaluation.py \
            --native-root "$APX_PACKAGES_ROOT" \
            > native-apx-adversarial-metrics.json
          python - <<'PY'
          import json
          with open('native-apx-adversarial-metrics.json') as src:
              report=json.load(src)
          assert report['detector_id']=='ORIGINAL_APX_NATIVE_SEMANTIC_SOURCE_COMPARATOR'
          assert report['cases']==30 and report['consequential_cases']==18
          assert report['control_cases']==12
          assert report['qualityrag_admission']=='INCONCLUSIVE'
          assert report['can_generate'] is False
          print('Native APX consequential detection lower bound:',
                report['consequential_detection_rate_lower_bound'])
          print('Native APX control false alarm rate:',
                report['control_flag_rate'])
          print('Undetected consequential cases:',len(report['cases_not_detected']))
          PY
      - name: Save inspectable native evaluation metrics
        uses: actions/upload-artifact@v4
        with:
          name: apx-native-adversarial-metrics
          path: native-apx-adversarial-metrics.json
          retention-days: 14
      - name: Record source versions without exposing private code
        shell: bash
        run: |
          echo "QualityRag $(git -C qualityrag rev-parse HEAD)"
          echo "APX $(git -C apx rev-parse HEAD)"
