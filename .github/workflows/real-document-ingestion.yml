name: Real document ingestion lab
on: [push, pull_request]
jobs:
  generated-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r examples/enterprise-rag/requirements.txt
      - run: python examples/enterprise-rag/build_documents.py
      - run: PYTHONPATH=sdk/python python examples/enterprise-rag/ingest_documents.py
