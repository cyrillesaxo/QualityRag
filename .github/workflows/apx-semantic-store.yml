name: APX Semantic Store Prototype

on:
  pull_request:
    paths:
      - "tools/semantic_store/**"
      - "tools/packspec_compiler/**"
      - "sdk/python/**"
      - ".github/workflows/apx-semantic-store.yml"
  push:
    branches:
      - "feat/apx-semantic-store-foundation"
      - "feat/native-apx-ci-parity"
    paths:
      - "tools/semantic_store/**"
      - ".github/workflows/apx-semantic-store.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shared governance dependencies
        run: python -m pip install -r tools/packspec_compiler/requirements.txt
      - name: Semantic store unit tests
        run: python -m unittest discover -s tools/semantic_store/tests -p 'test_*.py' -v
      - name: PackSpec compiler regression suite
        run: python -m unittest discover -s tools/packspec_compiler/tests -p 'test_*.py' -v
      - name: Python SDK witness/assurance regression suite
        env:
          PYTHONPATH: sdk/python
        run: python -m unittest discover -s sdk/python/tests -p 'test_*.py' -v
      - name: Native APX adapter transport and fail-closed tests
        run: node --test tools/semantic_store/tests/test_rct_apx_native.mjs
      - name: Verify real APX native test syntax and absent-credential failure
        run: |
          node --check tools/semantic_store/tests/test_rct_apx_native_real.mjs
          if env -u APX_PACKAGES_ROOT node --test tools/semantic_store/tests/test_rct_apx_native_real.mjs; then
            echo "::error::Native tests succeeded without a configured APX workspace"
            exit 1
          fi
      - name: Native source-span comparator transport and strict missing-engine checks
        run: |
          node --test tools/semantic_store/tests/test_rct_apx_semantic_spans_transport.mjs
          node --check tools/semantic_store/tests/test_rct_apx_semantic_spans_real.mjs
          if env -u APX_PACKAGES_ROOT node --test tools/semantic_store/tests/test_rct_apx_semantic_spans_real.mjs; then
            echo "::error::Native semantic tests succeeded without the original APX engine"
            exit 1
          fi
      - name: Original APX D15 adapter syntax and fail-closed transport
        run: |
          node --test tools/semantic_store/tests/test_rct_apx_deception_transport.mjs
          node --check tools/semantic_store/tests/test_rct_apx_deception_real.mjs
          if env -u APX_PACKAGES_ROOT node --test tools/semantic_store/tests/test_rct_apx_deception_real.mjs; then
            echo "::error::Original APX D15 tests passed without original source"
            exit 1
          fi
      - name: Single-command RCT research demonstration
        run: python tools/semantic_store/rct_demo.py
      - name: Reproducible 30-case adverse semantic baseline
        run: |
          python tools/semantic_store/rct_semantic_evaluation.py > /tmp/rct-adversarial-baseline.json
          python - <<'PY'
          import json
          with open('/tmp/rct-adversarial-baseline.json') as stream:
              r=json.load(stream)
          assert r['cases']==30 and r['consequential_cases']==18
          assert r['control_cases']==12
          assert r['counts']['consequential_detected']==18
          assert r['counts']['control_flagged']==12
          assert r['qualityrag_admission']=='INCONCLUSIVE'
          assert r['can_generate'] is False
          print('Baseline detected',r['counts']['consequential_detected'],
                'of',r['consequential_cases'],'consequential changes; flagged',
                r['counts']['control_flagged'],'of',r['control_cases'],'controls')
          PY
      - name: Verify Python syntax
        run: python -m compileall -q tools/semantic_store tools/packspec_compiler sdk/python
