name: APX Semantic Store Prototype

on:
  pull_request:
    paths:
      - "tools/semantic_store/**"
      - ".github/workflows/apx-semantic-store.yml"
  push:
    branches:
      - "feat/apx-semantic-store-foundation"
    paths:
      - "tools/semantic_store/**"
      - ".github/workflows/apx-semantic-store.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canonical signature verifier dependency
        run: python -m pip install 'cryptography>=44,<47'
      - name: Semantic store unit tests
        run: python -m unittest discover -s tools/semantic_store/tests -p 'test_*.py' -v
      - name: Verify Python syntax
        run: python -m compileall -q tools/semantic_store
