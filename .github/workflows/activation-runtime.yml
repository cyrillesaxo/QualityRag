name: Activation runtime research
on: [push, pull_request]
jobs:
  bounded-activation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libseccomp2
      - run: python -m pip install -r tools/activation_runtime/research/requirements.lock.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: npm ci && npm test
        working-directory: sdk/typescript
      - run: python -m unittest discover -s tools/packspec_compiler -p 'test_finite_activation.py' -v
      - run: python -m unittest discover -s tools/activation_runtime/tests -p 'test_*.py' -v
        env:
          QUALITYRAG_APX_ROOT: ${{ github.workspace }}/tools/activation_runtime/vendor/apx
          QUALITYRAG_BROWSER_TESTS: '1'
      - run: python -m unittest discover -s tools/packspec_compiler/tests -p 'test_*.py' -v
      - run: python -m unittest discover -s tools/research_ledger/tests -p 'test_*.py' -v
      - run: python -m tools.activation_runtime.audit
      - run: python -m tools.activation_runtime.demo --out /tmp/activation-demo
      - run: python -m tools.activation_runtime.run_research --out /tmp/activation-research
      - uses: actions/upload-artifact@v4
        with:
          name: finite-activation-receipts
          path: |
            /tmp/activation-demo
            /tmp/activation-research/receipt.json
