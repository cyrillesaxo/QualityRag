name: Owner scoped Drive search
on:
  pull_request:
    paths:
      - 'apps/registry/src/scoped-drive-control.js'
      - 'apps/registry/test/owner-drive-search.test.js'
      - '.github/workflows/owner-drive-search.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix apps/registry install --no-audit --no-fund
      - run: |
          node --check apps/registry/src/scoped-drive-control.js
          node --test apps/registry/test/owner-drive-search.test.js apps/registry/test/scoped-drive-control.test.js
