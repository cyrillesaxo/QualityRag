name: Enterprise RAG training example
on: [push, pull_request]
jobs:
  deterministic-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: PYTHONPATH=sdk/python python -m unittest discover -s examples/enterprise-rag -p 'test_*.py'
      - run: PYTHONPATH=sdk/python python examples/enterprise-rag/demo.py
