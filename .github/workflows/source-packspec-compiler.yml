name: Source PackSpec compiler
on: [push, pull_request]
jobs:
  conservative-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r tools/packspec_compiler/requirements.txt
      - run: python -m unittest discover -s tools/packspec_compiler/tests -p 'test_*.py'
