name: Capability Frontier Research
on:
  pull_request:
    paths:
      - 'tools/capability_frontier/**'
      - '.github/workflows/capability-frontier.yml'
  push:
    paths:
      - 'tools/capability_frontier/**'
      - '.github/workflows/capability-frontier.yml'
permissions:
  contents: read
jobs:
  offline-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify evaluator and runner contracts
        run: python -m unittest discover -s tools/capability_frontier/tests -p 'test_*.py' -v
