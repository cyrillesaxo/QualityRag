# Dedicated qualityrag-mcp Netlify site: package lives in netlify/mcp.
# This root config supplies the base directory when the site's UI uses '/'.
[build]
  base = "netlify/mcp"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Authentication belongs in runtime site environment, never in TOML.
# The app deliberately returns 401 when QUALITYRAG_MCP_ACCESS_TOKEN is unset.
